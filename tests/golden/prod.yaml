# Source: shortly/templates/hpa.yaml
# Scales on CPU because CPU is the measured bottleneck (docs/DESIGN.md, Capacity): one pod
# saturates at ~1 core (single worker, GIL) long before its DB pool does.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortly
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/instance: shortly
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shortly-<version>
spec:
  scaleTargetRef: # the Rollout when canary.enabled: it has the same scale subresource
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: shortly
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 1
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 15
        type: Percent
        value: 100
      - periodSeconds: 15
        type: Pods
        value: 4
      selectPolicy: Max
      stabilizationWindowSeconds: 0

