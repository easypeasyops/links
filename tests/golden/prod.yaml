# Source: shortly/templates/dashboards.yaml
# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1, in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shortly-dashboards
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/instance: shortly
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shortly-<version>
    grafana_dashboard: "1"
data:
  slo.json: |
    {
      "uid": "shortly-slo",
      "title": "shortly / SLOs",
      "tags": [
        "shortly",
        "slo"
      ],
      "timezone": "browser",
      "description": "Error budgets, burn rates and their likely causes. Generated rules: deploy/helm/shortly/rules/slo.yaml.",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {}
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Environment",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(slo:sli_error:ratio_rate5m, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(slo:sli_error:ratio_rate5m, namespace)",
            "refresh": 2,
            "current": {
              "text": "prod",
              "value": "prod"
            }
          }
        ]
      },
      "links": [
        {
          "title": "Runbook",
          "type": "link",
          "url": "https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#slo-burn-rate-alerts",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Error budgets (30 days)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Error budget remaining",
          "description": "Share of each SLO's 30-day error budget still unspent. 100% = untouched; below 0 = overspent (freeze features, fix reliability).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 24,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "slo:error_budget_remaining:ratio{namespace=\"$namespace\"}",
              "legendFormat": "{{slo}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "min": -1,
              "max": 1,
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Burn rate (1h)",
          "description": "How fast each budget is being spent. 1 = on pace to use exactly the 30-day budget. Pages need 14.4 (over 1h and 5m) or 6 (over 6h and 30m).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "slo:sli_error:ratio_rate1h{namespace=\"$namespace\"} / on(slo) group_left () (1 - slo:objective:ratio)",
              "legendFormat": "{{slo}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "thresholdsStyle": {
                  "mode": "line+area"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error ratio (5m) vs budget",
          "description": "Share of bad events right now, next to the share each SLO allows (dashed). Above its budget line, that SLO is burning.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "slo:sli_error:ratio_rate5m{namespace=\"$namespace\"}",
              "legendFormat": "{{slo}} errors"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - slo:objective:ratio",
              "legendFormat": "{{slo}} budget"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".* budget"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {}
        },
        {
          "id": 101,
          "type": "row",
          "title": "Traffic and causes",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Requests by status",
          "description": "User-facing requests per second (probes and scrapes excluded). 404 and 410 are good answers; 5xx burn the availability SLOs.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"$namespace\", route!~\"/healthz|/readyz|/metrics\"}[$__rate_interval]))",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "p99 latency by route",
          "description": "The latency SLOs: redirects under 50 ms, creates under 100 ms, for 99% of requests.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le, route) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", route!~\"/healthz|/readyz|/metrics\"}[$__rate_interval])))",
              "legendFormat": "{{route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pods",
          "description": "Available pods against the autoscaler's ceiling. Pinned at max with burn rising: raise maxReplicas (Capacity in the design doc).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_replicaset_status_ready_replicas{namespace=\"$namespace\", replicaset=~\"shortly-[a-z0-9]+\"})",
              "legendFormat": "available"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\", horizontalpodautoscaler=\"shortly\"}",
              "legendFormat": "HPA max"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "DB pool in use",
          "description": "Connections checked out across all pods. In use near size with load shed rising: the database is slow, not the app.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 23,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(db_pool_in_use{namespace=\"$namespace\"})",
              "legendFormat": "in use"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
