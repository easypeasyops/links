            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 9,
          "type": "table",
          "title": "Firing alerts",
          "description": "Alerts Prometheus is firing for this namespace. Routing, grouping and silences live in Alertmanager.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "ALERTS{alertstate=\"firing\", namespace=\"$namespace\"}",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
