# Source: shortly/templates/pdb.yaml
# Voluntary disruptions (node drains, cluster upgrades) may evict pods only while at least
# minAvailable stay up. Skipped for a single replica, where it would block every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shortly
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/instance: shortly
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shortly-<version>
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shortly
      app.kubernetes.io/instance: shortly

