# Source: shortly/templates/cronjobs.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shortly-cleanup
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/instance: shortly
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shortly-<version>
    app.kubernetes.io/component: cleanup
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  # Never two runs at once from the schedule (a manual run may overlap: the job must make
  # that safe). A run that starts late (a laptop that slept, a controller restart) still
  # starts within 50 minutes; later than that it is skipped, not queued.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3000
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shortly-cleanup
            app.kubernetes.io/instance: shortly
            app.kubernetes.io/part-of: shortly
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
