# Source: shortly/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shortly-shortly
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/instance: shortly
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shortly-<version>
spec:
  # Cause-based alerts for shortly, hand-written. The SLO alerts (slo.yaml, generated) say
  # "users are hurting"; these cover what an SLO cannot see, or warn before it is spent.
  # Every runbook_url anchor must exist in docs/RUNBOOK.md (tests/test_alert_rules.py checks).
  groups:
    - name: shortly-health
      rules:
        # The SLO is computed FROM the app's own metrics: if no pod is scraped, there is no
        # traffic data, every ratio is empty, and no burn-rate alert can fire. A full outage
        # would be silent without this one.
        - alert: ShortlyDown
          expr: sum(up{job="shortly"}) == 0 or absent(up{job="shortly"})
          for: 2m
          labels:
            severity: page
          annotations:
            summary: No shortly target is being scraped
            description: Prometheus has no healthy shortly target, so the SLO alerts are blind. Treat it as a full outage until proven otherwise.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#shortlydown
  
        # Needs kube-state-metrics. One environment with zero available pods is down, even
        # though another one is still being scraped (ShortlyDown only catches "nothing anywhere").
        # Counted over the ReplicaSets ("shortly-<pod hash>"), which a Deployment (staging) and
        # an Argo Rollout (prod) both create: kube-state-metrics knows nothing about Rollouts.
        - alert: ShortlyNoAvailablePods
          expr: sum by (namespace) (kube_replicaset_status_ready_replicas{replicaset=~"shortly-[a-z0-9]+"}) == 0
          for: 1m
          labels:
            severity: page
          annotations:
            summary: shortly has no available pods
            description: The Deployment or Rollout has zero ready replicas in this namespace, so every request to it fails.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#shortlynoavailablepods
  
        # Pods that fail readiness are removed from the Service. Users then get errors at the
        # load balancer, which the app never sees, so the availability SLI stays green.
        - alert: ShortlyNotReady
          expr: |-
            sum by (namespace) (rate(http_requests_total{route="/readyz", status="503"}[5m]))
              / sum by (namespace) (rate(http_requests_total{route="/readyz"}[5m])) > 0.5
          for: 5m
          labels:
            severity: page
          annotations:
            summary: Most readiness checks are failing
            description: Over half of /readyz checks return 503 (usually the database is unreachable). Pods are out of rotation; user requests fail before they reach the app.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#pods-not-ready-readyz-returns-503
  
        # 503 + Retry-After because no DB connection freed up in time. Usually a slow database.
        # It also burns the availability budget; this alert names the cause.
        - alert: ShortlyLoadShedding
          # One alert per reason: "concurrency" is too much traffic for the pods (the HPA's
          # job), "pool" and "db_timeout" point at the database. Different fixes, so the
          # ticket says which.
          expr: sum by (namespace, reason) (rate(load_shed_total[5m])) > 0
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: Requests are being shed with 503 ({{ $labels.reason }})
            description: Requests have been shed for 5 minutes, reason {{ $labels.reason }}. concurrency means pods at their in-flight limit (traffic above capacity); pool or db_timeout mean a slow database. Check the database before adding replicas.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#saturation-load-shed-or-hpa-at-max
  
        # Needs kube-state-metrics in the cluster (not part of the local stack). At max, the
        # next traffic increase becomes latency: raise maxReplicas or add capacity.
        - alert: ShortlyAtMaxReplicas
          expr: |-
            kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="shortly"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="shortly"}
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: The HPA has been at maxReplicas for 15 minutes
            description: Autoscaling has no headroom left. See Capacity in the design doc for the sizing rule and the DB connection budget.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#saturation-load-shed-or-hpa-at-max
  
        # 429s are the limiter working, so they never burn the availability SLO. A large,
        # sustained share is still worth a look: one client hammering creates (abuse, or a
        # buggy integration in a loop), or a limit too tight for many users behind one
        # address (corporate or carrier-grade NAT).
        - alert: ShortlyRateLimiting
          expr: |-
            sum by (namespace) (rate(rate_limited_total[15m]))
              / sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[15m])) > 0.1
          for: 30m
          labels:
            severity: ticket
          annotations:
            summary: Over 10% of link creations are rate limited
            description: For 30 minutes, more than 1 in 10 POST /links requests got 429. Find out whether it is abuse or a limit that is too tight for legitimate clients.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#rate-limiting-429-on-post-links
  
        # Fault injection is for drills, which last minutes. Still on after 15 minutes means a
        # drill was abandoned or the setting leaked into a release: users are getting 500s on
        # purpose. The availability SLO burns too, but this names the cause.
        - alert: ShortlyFaultInjectionOn
          expr: sum by (namespace) (rate(faults_injected_total[5m])) > 0
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: Fault injection is failing requests on purpose
            description: SHORTLY_FAULT_ERROR_RATIO is set in {{ $labels.namespace }} and has been failing requests for 15 minutes. Remove config.faultErrorRatio and redeploy.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#fault-injection-left-on
  
        # Needs kube-state-metrics. A cron job that stops running fails silently: nothing
        # breaks for weeks, then the table is huge. Fires when the last success is over
        # 3 hours old (3 missed hourly runs), or the CronJob has existed for 3 hours
        # without ever succeeding (a new install whose first runs all fail).
        - alert: ShortlyCleanupNotRunning
          expr: |-
            time() - max by (namespace) (kube_cronjob_status_last_successful_time{cronjob="shortly-cleanup"}) > 3 * 3600
              or (
                time() - max by (namespace) (kube_cronjob_created{cronjob="shortly-cleanup"}) > 3 * 3600
                  unless max by (namespace) (kube_cronjob_status_last_successful_time{cronjob="shortly-cleanup"})
              )
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: Expired-link cleanup hasn't succeeded for over 3 hours
            description: The shortly-cleanup CronJob has missed at least 3 runs, or has never succeeded. Expired links pile up until it runs again.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#cleanup-job-not-running
  
        # Needs kube-state-metrics. Backups that silently stopped are found during the
        # incident that needs them. Hourly job (RPO 1 h): fires after 2 missed runs, or if it
        # has never succeeded in 2 hours. Only where a postgres-backup CronJob exists (the
        # kind setup); a managed database's backups are watched through its provider.
        - alert: ShortlyBackupNotRunning
          expr: |-
            time() - max by (namespace) (kube_cronjob_status_last_successful_time{cronjob="postgres-backup"}) > 2 * 3600
              or (
                time() - max by (namespace) (kube_cronjob_created{cronjob="postgres-backup"}) > 2 * 3600
                  unless max by (namespace) (kube_cronjob_status_last_successful_time{cronjob="postgres-backup"})
              )
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: Postgres backups haven't succeeded for over 2 hours
            description: The postgres-backup CronJob has missed at least 2 runs, or has never succeeded. Data written since the last good backup can't be recovered if the database is lost.
            runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#backup-job-not-running
  

