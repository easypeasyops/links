# Source: shortly/templates/networkpolicy.yaml
# A scheduled job's pods: nothing may connect to them; they may reach DNS and the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shortly-cleanup
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/instance: shortly
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shortly-<version>
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shortly-cleanup
      app.kubernetes.io/instance: shortly
      app.kubernetes.io/part-of: shortly
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { port: 5432, protocol: TCP }

