# Source: shortly/templates/rollout.yaml
# Stable and canary Services: the HTTPRoute's two backends. Argo Rollouts adds
# rollouts-pod-template-hash to each selector, so each one holds a single version's pods.
# Traffic only: no metrics port, so the ServiceMonitor (which scrapes port "metrics" of
# Services with the selector labels) finds no targets here and scrapes every pod once,
# through the main Service. Its endpoints carry both versions.

---
# Source: shortly/templates/analysistemplate.yaml
# What a canary step checks, on the canary's pods only. Prometheus scrapes each pod with its
# rollouts-pod-template-hash label (the ServiceMonitor's podTargetLabels), so the canary's
# series are told apart from the stable pods' without any new metric in the app.
# Absolute thresholds, not "no worse than stable": simple to reason about, and the stable
# version meets them by a wide margin (docs/DESIGN.md, Capacity).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: shortly-canary
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/instance: shortly
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shortly-<version>
spec:
  args:
    - name: canary-hash
  metrics:
    # Too little traffic proves nothing: fail rather than pass a canary nobody used.
    # (`or vector(0)`: no series at all is 0 req/s, a clear failure, not a query error.)
    # One miss is allowed: the first measurement can land before Prometheus has scraped the
    # new pod twice (service discovery lags), which reads as 0 req/s.
    - name: traffic
      initialDelay: 60s
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: result[0] >= 0.5
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{namespace="prod", rollouts_pod_template_hash="{{args.canary-hash}}", route!~"/healthz|/readyz"}[1m])) or vector(0)
    # Server errors, including 503 from load shedding: what the availability SLOs count.
    - name: error-ratio
      initialDelay: 60s
      interval: 30s
      count: 4
      failureLimit: 0
      successCondition: result[0] <= 0.01
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc:9090
          query: |
            (sum(rate(http_requests_total{namespace="prod", rollouts_pod_template_hash="{{args.canary-hash}}", route!~"/healthz|/readyz", status=~"5.."}[1m])) or vector(0))
            /
            sum(rate(http_requests_total{namespace="prod", rollouts_pod_template_hash="{{args.canary-hash}}", route!~"/healthz|/readyz"}[1m]))
    # Not a check: the traffic the checks above judge. Lasts as long as the step's analysis.
    - name: synthetic-traffic
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 280
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: canary-traffic
                  app.kubernetes.io/instance: shortly
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 12345
                  runAsGroup: 12345
                  seccompProfile: { type: RuntimeDefault }
                containers:
                  - name: k6
                    image: grafana/k6:2.3.0
                    args: [run, --quiet, --no-color, --no-thresholds, /scripts/canary-traffic.js]
                    env:
                      - { name: BASE_URL, value: "http://shortly-gateway.envoy-gateway-system.svc" }
                      - { name: HOST, value: "sho.rt.localhost" }
                      - { name: RATE, value: "20" }
                      - { name: DURATION, value: "160s" }
                    resources:
                      requests: { cpu: 50m, memory: 64Mi }
                      limits: { memory: 256Mi }
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: { drop: [ALL] }
                    volumeMounts:
                      - { name: scripts, mountPath: /scripts, readOnly: true }
                      - { name: tmp, mountPath: /tmp }
                volumes:
                  - name: scripts
                    configMap: { name: shortly-canary-traffic }
                  - name: tmp
                    emptyDir: { sizeLimit: 64Mi }
    - name: redirect-p99
      initialDelay: 60s
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: result[0] <= 0.25
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="prod", rollouts_pod_template_hash="{{args.canary-hash}}", method="GET", route="/{code}"}[1m])))

---
# Source: shortly/templates/httproute.yaml
# Users reach the app through the cluster's Gateway (Gateway API), by hostname. In prod,
# Argo Rollouts shifts this route's weights between the stable and canary Services during
# a canary release.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shortly
  labels:
    app.kubernetes.io/name: shortly
    app.kubernetes.io/instance: shortly
    app.kubernetes.io/version: "000000000000"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shortly-<version>
spec:
  parentRefs:
    - name: shortly
      namespace: gateway
  hostnames:
    - sho.rt.localhost
  rules:
    - backendRefs:
        # Argo Rollouts sets these weights during a release. 100/0 is the resting state, so
        # an upgrade that re-applies them (before the Rollout starts its steps) is harmless.
        - name: shortly-stable
          port: 80
          weight: 100
        - name: shortly-canary
          port: 80
          weight: 0

