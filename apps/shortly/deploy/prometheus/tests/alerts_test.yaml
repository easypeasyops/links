# promtool unit tests for every alert: synthetic series in, expected alerts out.
#   docker run --rm -v "$PWD/deploy:/d:ro" --entrypoint promtool \
#     prom/prometheus:v3.15.0 test rules /d/prometheus/tests/alerts_test.yaml
# Run in CI by tests/test_alert_rules.py. Each scenario proves an alert fires when it should
# AND stays quiet when it shouldn't: an alert that is never tested is assumed broken.
rule_files:
  - ../rules/slo.yaml
  - ../rules/shortly.yaml

evaluation_interval: 1m

tests:
  # 5% of redirects fail: 50x the budget rate. Both severities fire.
  - name: redirect 5xx at 5% pages
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET",route="/{code}",status="307"}'
        values: '0+5700x120'
      - series: 'http_requests_total{method="GET",route="/{code}",status="500"}'
        values: '0+300x120'
    promql_expr_test:
      - expr: round(slo:sli_error:ratio_rate5m{slo="redirect-availability"}, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{slo="redirect-availability"}'
            value: 0.05
      - expr: round(slo:error_budget_remaining:ratio{slo="redirect-availability"}, 0.01)
        eval_time: 10m
        exp_samples:
          - labels: '{slo="redirect-availability"}'
            value: -49 # 5% errors is 50x the 0.1% budget: 1 - 50 = -49, deeply overspent
    alert_rule_test:
      - eval_time: 1m # the 2-minute `for` has not elapsed yet
        alertname: RedirectAvailabilityBudgetBurn
        exp_alerts: []
      - eval_time: 70m
        alertname: RedirectAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels: {severity: page, slo: redirect-availability}
            exp_annotations:
              summary: 'redirect-availability: error budget burning fast (14.4x over 1h or 6x over 6h)'
              description: 'GET /{code} answers without a server error: objective 0.999 over 30 days. At this pace the whole budget lasts only 2 to 5 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts
          - exp_labels: {severity: ticket, slo: redirect-availability}
            exp_annotations:
              summary: 'redirect-availability: error budget burning steadily (3x over 1d or 1x over 3d)'
              description: 'GET /{code} answers without a server error: objective 0.999 over 30 days. At this pace the whole budget lasts only 10 to 30 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts

  # 0.05% errors: half the budget rate. Nothing fires.
  - name: redirect errors within budget stay quiet
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET",route="/{code}",status="307"}'
        values: '0+5997x240'
      - series: 'http_requests_total{method="GET",route="/{code}",status="500"}'
        values: '0+3x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: RedirectAvailabilityBudgetBurn
        exp_alerts: []

  # 404 (unknown link) and 410 (expired) are correct answers, not failures.
  - name: 404 and 410 count as good
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET",route="/{code}",status="404"}'
        values: '0+3000x120'
      - series: 'http_requests_total{method="GET",route="/{code}",status="410"}'
        values: '0+3000x120'
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate1h{slo="redirect-availability"}
        eval_time: 70m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate1h{slo="redirect-availability"}'
            value: 0
    alert_rule_test:
      - eval_time: 70m
        alertname: RedirectAvailabilityBudgetBurn
        exp_alerts: []

  # 0.5% errors for a day: 5x the budget rate. Too slow to page, worth a ticket.
  - name: slow burn opens a ticket, not a page
    interval: 5m
    input_series:
      - series: 'http_requests_total{method="GET",route="/{code}",status="307"}'
        values: '0+29850x320'
      - series: 'http_requests_total{method="GET",route="/{code}",status="500"}'
        values: '0+150x320'
    alert_rule_test:
      - eval_time: 25h
        alertname: RedirectAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels: {severity: ticket, slo: redirect-availability}
            exp_annotations:
              summary: 'redirect-availability: error budget burning steadily (3x over 1d or 1x over 3d)'
              description: 'GET /{code} answers without a server error: objective 0.999 over 30 days. At this pace the whole budget lasts only 10 to 30 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts

  # 20% of redirects slower than 50 ms (the bucket edge the SLO uses).
  - name: slow redirects page on latency
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{method="GET",route="/{code}"}'
        values: '0+6000x120'
      - series: 'http_request_duration_seconds_bucket{method="GET",route="/{code}",le="0.05"}'
        values: '0+4800x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: RedirectLatencyBudgetBurn
        exp_alerts:
          - exp_labels: {severity: page, slo: redirect-latency}
            exp_annotations:
              summary: 'redirect-latency: error budget burning fast (14.4x over 1h or 6x over 6h)'
              description: 'GET /{code} answers in under 50 ms: objective 0.99 over 30 days. At this pace the whole budget lasts only 2 to 5 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts
          - exp_labels: {severity: ticket, slo: redirect-latency}
            exp_annotations:
              summary: 'redirect-latency: error budget burning steadily (3x over 1d or 1x over 3d)'
              description: 'GET /{code} answers in under 50 ms: objective 0.99 over 30 days. At this pace the whole budget lasts only 10 to 30 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts

  # A quiet hour: 3 creates an hour, 1 of them slow (33%, far over any burn threshold). One
  # slow request is not an incident: below MIN_BAD_EVENTS (5) in the long window, nothing
  # fires. A sustained tail still alerts once it adds up: here at 6 bad events in 6 hours.
  - name: one slow request on a quiet service does not page
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{method="POST",route="/links"}'
        values: '0+0.05x420' # 3 per hour
      - series: 'http_request_duration_seconds_bucket{method="POST",route="/links",le="0.1"}'
        values: '0+0.0333333x420' # 2 per hour under 100 ms
    alert_rule_test:
      - eval_time: 70m
        alertname: CreateLatencyBudgetBurn
        exp_alerts: []
      - eval_time: 6h50m
        alertname: CreateLatencyBudgetBurn
        exp_alerts:
          - exp_labels: {severity: page, slo: create-latency}
            exp_annotations:
              summary: 'create-latency: error budget burning fast (14.4x over 1h or 6x over 6h)'
              description: 'POST /links answers in under 100 ms: objective 0.99 over 30 days. At this pace the whole budget lasts only 2 to 5 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts
          - exp_labels: {severity: ticket, slo: create-latency}
            exp_annotations:
              summary: 'create-latency: error budget burning steadily (3x over 1d or 1x over 3d)'
              description: 'POST /links answers in under 100 ms: objective 0.99 over 30 days. At this pace the whole budget lasts only 10 to 30 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts

  # The v0.7.1 canary on the kind cluster (2026-10-24): about 44 creates a minute, 7% over
  # 100 ms, on an otherwise idle prod. A real tail, so the guard must not hide it: it pages.
  - name: a real latency tail on modest traffic still pages
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{namespace="prod",method="POST",route="/links"}'
        values: '0+44x30'
      - series: 'http_request_duration_seconds_bucket{namespace="prod",method="POST",route="/links",le="0.1"}'
        values: '0+41x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: CreateLatencyBudgetBurn
        exp_alerts:
          - exp_labels: {namespace: prod, severity: page, slo: create-latency}
            exp_annotations:
              summary: 'create-latency: error budget burning fast (14.4x over 1h or 6x over 6h)'
              description: 'POST /links answers in under 100 ms: objective 0.99 over 30 days. At this pace the whole budget lasts only 2 to 5 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts
          - exp_labels: {namespace: prod, severity: ticket, slo: create-latency}
            exp_annotations:
              summary: 'create-latency: error budget burning steadily (3x over 1d or 1x over 3d)'
              description: 'POST /links answers in under 100 ms: objective 0.99 over 30 days. At this pace the whole budget lasts only 10 to 30 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts

  # Staging and prod are separate budgets: an outage in staging must not page for prod.
  - name: budgets are per namespace
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="prod",method="POST",route="/links",status="201"}'
        values: '0+600x120'
      - series: 'http_requests_total{namespace="staging",method="POST",route="/links",status="503"}'
        values: '0+600x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: CreateAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels: {namespace: staging, severity: page, slo: create-availability}
            exp_annotations:
              summary: 'create-availability: error budget burning fast (14.4x over 1h or 6x over 6h)'
              description: 'POST /links answers without a server error: objective 0.995 over 30 days. At this pace the whole budget lasts only 2 to 5 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts
          - exp_labels: {namespace: staging, severity: ticket, slo: create-availability}
            exp_annotations:
              summary: 'create-availability: error budget burning steadily (3x over 1d or 1x over 3d)'
              description: 'POST /links answers without a server error: objective 0.995 over 30 days. At this pace the whole budget lasts only 10 to 30 days.'
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#slo-burn-rate-alerts

  - name: every target down pages
    interval: 1m
    input_series:
      - series: 'up{job="shortly",instance="a"}'
        values: '0x10'
      - series: 'up{job="shortly",instance="b"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ShortlyDown
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations: &down
              summary: No shortly target is being scraped
              description: Prometheus has no healthy shortly target, so the SLO alerts are blind. Treat it as a full outage until proven otherwise.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#shortlydown

  - name: one target down is not an outage
    interval: 1m
    input_series:
      - series: 'up{job="shortly",instance="a"}'
        values: '0x10'
      - series: 'up{job="shortly",instance="b"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ShortlyDown
        exp_alerts: []

  - name: no shortly targets at all pages
    interval: 1m
    input_series:
      - series: 'up{job="something-else"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ShortlyDown
        exp_alerts:
          - exp_labels: {job: shortly, severity: page}
            exp_annotations: *down

  - name: a namespace with no ready pods pages, the others stay quiet
    interval: 1m
    input_series:
      # staging: a Deployment's one ReplicaSet goes to 0.
      - series: 'kube_replicaset_status_ready_replicas{namespace="staging",replicaset="shortly-6d4f9c8b7"}'
        values: '1 1 0x10'
      # prod: a Rollout keeps old ReplicaSets at 0 next to the live one. Their zeros must
      # not page while another ReplicaSet has ready pods.
      - series: 'kube_replicaset_status_ready_replicas{namespace="prod",replicaset="shortly-5b7c6d9f8"}'
        values: '0x12'
      - series: 'kube_replicaset_status_ready_replicas{namespace="prod",replicaset="shortly-7f8d9c6b5"}'
        values: '2x12'
    alert_rule_test:
      - eval_time: 2m # zero for 0 minutes: not yet
        alertname: ShortlyNoAvailablePods
        exp_alerts: []
      - eval_time: 5m
        alertname: ShortlyNoAvailablePods
        exp_alerts:
          - exp_labels: {namespace: staging, severity: page}
            exp_annotations:
              summary: shortly has no available pods
              description: The Deployment or Rollout has zero ready replicas in this namespace, so every request to it fails.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#shortlynoavailablepods

  - name: failing readiness pages
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET",route="/readyz",status="503"}'
        values: '0+12x20'
      - series: 'http_requests_total{method="GET",route="/readyz",status="200"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ShortlyNotReady
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: Most readiness checks are failing
              description: Over half of /readyz checks return 503 (usually the database is unreachable). Pods are out of rotation; user requests fail before they reach the app.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#pods-not-ready-readyz-returns-503

  - name: sustained load shedding opens a ticket
    interval: 1m
    input_series:
      - series: 'load_shed_total{reason="concurrency"}'
        values: '0x5 0+60x15'
      - series: 'load_shed_total{reason="pool"}'
        values: '0x20' # exported, but nothing shed for this reason: no alert for it
    alert_rule_test:
      - eval_time: 8m # shedding for 3 minutes: not yet
        alertname: ShortlyLoadShedding
        exp_alerts: []
      - eval_time: 15m
        alertname: ShortlyLoadShedding
        exp_alerts:
          - exp_labels: {severity: ticket, reason: concurrency}
            exp_annotations:
              summary: Requests are being shed with 503 (concurrency)
              description: Requests have been shed for 5 minutes, reason concurrency. concurrency means pods at their in-flight limit (traffic above capacity); pool or db_timeout mean a slow database. Check the database before adding replicas.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#saturation-load-shed-or-hpa-at-max

  - name: HPA pinned at max opens a ticket
    interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_current_replicas{namespace="prod",horizontalpodautoscaler="shortly"}'
        values: '4x30'
      - series: 'kube_horizontalpodautoscaler_spec_max_replicas{namespace="prod",horizontalpodautoscaler="shortly"}'
        values: '4x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ShortlyAtMaxReplicas
        exp_alerts:
          - exp_labels: {namespace: prod, horizontalpodautoscaler: shortly, severity: ticket}
            exp_annotations:
              summary: The HPA has been at maxReplicas for 15 minutes
              description: Autoscaling has no headroom left. See Capacity in the design doc for the sizing rule and the DB connection budget.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#saturation-load-shed-or-hpa-at-max

  - name: half of creates rate limited for 30 minutes opens a ticket
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="POST",route="/links",status="201"}'
        values: '0+60x90'
      - series: 'http_requests_total{method="POST",route="/links",status="429"}'
        values: '0+60x90'
      - series: 'rate_limited_total'
        values: '0+60x90'
    alert_rule_test:
      - eval_time: 25m # true since the start, but not for 30 minutes yet
        alertname: ShortlyRateLimiting
        exp_alerts: []
      - eval_time: 60m
        alertname: ShortlyRateLimiting
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: Over 10% of link creations are rate limited
              description: For 30 minutes, more than 1 in 10 POST /links requests got 429. Find out whether it is abuse or a limit that is too tight for legitimate clients.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#rate-limiting-429-on-post-links
      # Even at 50%: a 429 is a client error, so the create availability SLO doesn't burn.
      - eval_time: 60m
        alertname: CreateAvailabilityBudgetBurn
        exp_alerts: []

  - name: a few rate-limited creates stay quiet
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="POST",route="/links",status="201"}'
        values: '0+98x90'
      - series: 'http_requests_total{method="POST",route="/links",status="429"}'
        values: '0+2x90'
      - series: 'rate_limited_total'
        values: '0+2x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: ShortlyRateLimiting
        exp_alerts: []

  - name: cleanup that stopped succeeding opens a ticket
    interval: 1m
    input_series:
      # Last success at t=0, never again: 3 hours later it is stale.
      - series: 'kube_cronjob_status_last_successful_time{namespace="prod",cronjob="shortly-cleanup"}'
        values: '0x300'
      - series: 'kube_cronjob_created{namespace="prod",cronjob="shortly-cleanup"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 3h
        alertname: ShortlyCleanupNotRunning
        exp_alerts: []
      - eval_time: 3h20m
        alertname: ShortlyCleanupNotRunning
        exp_alerts:
          - exp_labels: {namespace: prod, severity: ticket}
            exp_annotations:
              summary: Expired-link cleanup hasn't succeeded for over 3 hours
              description: The shortly-cleanup CronJob has missed at least 3 runs, or has never succeeded. Expired links pile up until it runs again.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#cleanup-job-not-running

  - name: cleanup that never succeeded opens a ticket
    interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="prod",cronjob="shortly-cleanup"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: ShortlyCleanupNotRunning
        exp_alerts: []
      - eval_time: 3h20m
        alertname: ShortlyCleanupNotRunning
        exp_alerts:
          - exp_labels: {namespace: prod, severity: ticket}
            exp_annotations:
              summary: Expired-link cleanup hasn't succeeded for over 3 hours
              description: The shortly-cleanup CronJob has missed at least 3 runs, or has never succeeded. Expired links pile up until it runs again.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#cleanup-job-not-running

  - name: cleanup succeeding every hour stays quiet
    interval: 1m
    input_series:
      # The last success moves forward every hour: 0, 3600, 7200, ...
      - series: 'kube_cronjob_status_last_successful_time{namespace="prod",cronjob="shortly-cleanup"}'
        values: '0x59 3600x59 7200x59 10800x59 14400x59'
      - series: 'kube_cronjob_created{namespace="prod",cronjob="shortly-cleanup"}'
        values: '0x299'
    alert_rule_test:
      - eval_time: 4h50m
        alertname: ShortlyCleanupNotRunning
        exp_alerts: []

  - name: base backups that stopped open a ticket
    interval: 1m
    input_series:
      # Last base backup at t=0, nothing since.
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="prod",pod="shortly-db-1"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: ShortlyBackupNotRunning
        exp_alerts: [] # just over 2 h old, but not yet for 15 minutes
      - eval_time: 2h20m
        alertname: ShortlyBackupNotRunning
        exp_alerts:
          - exp_labels: {namespace: prod, severity: ticket}
            exp_annotations:
              summary: Postgres base backups haven't succeeded for over 2 hours
              description: The newest base backup of the namespace's database is over 2 hours old, or there is none. A restore has to replay WAL from an older base backup, or has nothing to start from.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#backups-not-running

  - name: hourly base backups stay quiet
    interval: 1m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="prod",pod="shortly-db-1"}'
        values: '0x59 3600x59 7200x59 10800x59'
    alert_rule_test:
      - eval_time: 3h50m
        alertname: ShortlyBackupNotRunning
        exp_alerts: []

  - name: failing WAL archiving opens a ticket
    interval: 1m
    input_series:
      # Archived until t=10m (600), then every attempt fails.
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="prod",pod="shortly-db-1"}'
        values: '0+60x10 600x60'
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="prod",pod="shortly-db-1"}'
        values: '-1x10 660+60x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ShortlyWalArchivingFailing
        exp_alerts: [] # failing for 10 minutes: not yet 15
      - eval_time: 30m
        alertname: ShortlyWalArchivingFailing
        exp_alerts:
          - exp_labels: {namespace: prod, severity: ticket}
            exp_annotations:
              summary: WAL archiving to the backup bucket is failing
              description: The database's last attempt to archive WAL failed and none has succeeded since. A restore can't reach past the last archived segment, and WAL piles up on the database's volume until it fills.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#backups-not-running

  - name: WAL archiving that recovered stays quiet
    interval: 1m
    input_series:
      # One failure at 5m, archiving again from 6m on.
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="prod",pod="shortly-db-1"}'
        values: '0x5 360+60x60'
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="prod",pod="shortly-db-1"}'
        values: '-1x4 300x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: ShortlyWalArchivingFailing
        exp_alerts: []

  - name: fault injection left on opens a ticket
    interval: 1m
    input_series:
      - series: 'faults_injected_total{namespace="prod"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 10m # a drill's few minutes: quiet
        alertname: ShortlyFaultInjectionOn
        exp_alerts: []
      - eval_time: 25m
        alertname: ShortlyFaultInjectionOn
        exp_alerts:
          - exp_labels: {namespace: prod, severity: ticket}
            exp_annotations:
              summary: Fault injection is failing requests on purpose
              description: SHORTLY_FAULT_ERROR_RATIO is set in prod and has been failing requests for 15 minutes. Remove config.faultErrorRatio and redeploy.
              runbook_url: https://github.com/easypeasyops/links/blob/main/apps/shortly/docs/RUNBOOK.md#fault-injection-left-on

  - name: a drill's short burst of injected faults stays quiet
    interval: 1m
    input_series:
      - series: 'faults_injected_total{namespace="prod"}'
        values: '0x5 0+30x5 150x30'
    alert_rule_test:
      - eval_time: 35m
        alertname: ShortlyFaultInjectionOn
        exp_alerts: []
