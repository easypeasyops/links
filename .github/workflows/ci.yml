name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN can write to the repo; CI only needs to read.
permissions:
  contents: read

# A new push to the same PR/branch cancels the now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs: tags are mutable, SHAs are not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true # Python version comes from .python-version

      - name: Install (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest --cov-fail-under=90
        env:
          # gh verifies the released image's provenance (tests/test_deploy_gate.py); the
          # read-only token is enough: the attestation bundle comes from the registry.
          GH_TOKEN: ${{ github.token }}
  image:
    name: build, scan, smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true # into the local daemon, so the next steps can use it
          tags: shortly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail on HIGH/CRITICAL vulns that have a fix available. Unfixed ones can't be
      # acted on yet, and failing on them just trains people to ignore the scanner.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shortly:ci
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test
        run: scripts/smoke.sh
        env:
          SHORTLY_IMAGE: shortly:ci
  
  k8s:
    name: deploy to kind, rollback drill
    runs-on: ubuntu-latest
    timeout-minutes: 35 # + kube-prometheus-stack, Kyverno, the alert and admission drills
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1 # deploy.sh uses Helm 4 flags (--rollback-on-failure)

      - name: Lint and schema-validate the chart
        run: |
          helm lint deploy/helm/shortly --set image.tag=ci
          # --api-versions renders the ServiceMonitor/PrometheusRule (normally only rendered
          # where the CRDs exist); their schemas come from the CRDs catalog, pinned by commit.
          crds=https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce
          for env in staging prod; do
            helm template shortly deploy/helm/shortly -n "$env" -f "deploy/envs/$env.yaml" --set image.tag=ci \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              --api-versions monitoring.coreos.com/v1/PrometheusRule \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.37.0 \
                  -schema-location default \
                  -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          done
          # The Kyverno admission policies (their verdicts are tested by pytest and step 8).
          docker run --rm -v "$PWD/deploy/policies:/p:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" /p

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: shortly
          config: deploy/kind/cluster.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: shortly:e2e
          cache-from: type=gha

      - name: Namespaces, Postgres, secrets
        run: scripts/cluster.sh up

      - name: Deploy, promote, rollback drill
        run: scripts/k8s-e2e.sh
        env:
          IMAGE: shortly:e2e
