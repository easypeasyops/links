name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN can write to the repo; CI only needs to read.
permissions:
  contents: read

# A new push to the same PR/branch cancels the now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs skip the work in every job (scripts/ci-scope.sh says why the jobs still
  # run and report success). Decided once, here; the jobs take it as an input.
  scope:
    name: change scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its first parent, for scripts/ci-scope.sh
      - name: Does this change need the checks?
        id: scope
        run: scripts/ci-scope.sh

  # The generic jobs live in reusable workflows (platform plan, Phase 1): any app's CI calls
  # them with its own inputs. Their checks are named "<caller> / <job>"; only `ci` (gate,
  # below) is required, so the names are free to change.
  check:
    needs: scope
    uses: ./.github/workflows/reusable-python-check.yml
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      # Full history: tests/test_gitops.py checks prod's digest against everything
      # staging has run on main.
      fetch-depth: 0
      helm-version: v4.3.1 # tests render the charts (test_platform.py, test_chart_golden.py)

  image:
    needs: scope
    uses: ./.github/workflows/reusable-image.yml
    with:
      run: ${{ needs.scope.outputs.full == 'true' }}
      smoke-command: SHORTLY_IMAGE="$IMAGE" scripts/smoke.sh

  # Two kind clusters in parallel, each running half of the e2e drills (E2E_SUITE in
  # scripts/k8s-e2e.sh): the platform checks plus GitOps, and the delivery drills (rollbacks
  # and canaries). One cluster ran them in about 14 minutes; two take about 8.
  k8s:
    name: kind e2e (${{ matrix.suite }})
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung drill shouldn't hold a runner
    strategy:
      fail-fast: false # a failure in one half shouldn't hide the other half's result
      matrix:
        include:
          # Platform: everything.
          - { suite: platform, policies: "1", backups: "1" }
          # Delivery: no admission policies or backups (unused there). Both install the
          # platform through Argo CD, from this commit: what CI tests is what a laptop runs.
          - { suite: delivery, policies: "0", backups: "0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: needs.scope.outputs.full == 'true'
        with:
          version: v4.3.1 # deploy.sh uses Helm 4 flags (--rollback-on-failure)

      - name: Lint and schema-validate the chart
        if: needs.scope.outputs.full == 'true'
        run: |
          helm lint deploy/helm/shortly --set image.tag=ci
          # --api-versions renders the ServiceMonitor/PrometheusRule (normally only rendered
          # where the CRDs exist); their schemas come from the CRDs catalog, pinned by commit.
          crds=https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce
          for env in staging prod; do
            helm template shortly deploy/helm/shortly -n "$env" -f "deploy/envs/$env.yaml" --set image.tag=ci \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              --api-versions monitoring.coreos.com/v1/PrometheusRule \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.37.0 \
                  -schema-location default \
                  -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          done
          # The Kyverno admission policies (their verdicts are tested by pytest and step 8).
          docker run --rm -v "$PWD/deploy/policies:/p:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" /p
          # The Argo CD projects and Applications: the app's (step 12 applies them for real),
          # the platform's root, and the child Applications the platform chart renders, for
          # both CPU architectures and with every component switched off once.
          lint_argocd() { docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -; }
          awk 'FNR == 1 { print "---" } 1' deploy/argocd/*.yaml | lint_argocd # one document stream
          helm lint deploy/argocd/platform --set arch=amd64
          for args in "--set arch=amd64" "--set arch=arm64" \
            "--set arch=amd64 --set components.monitoring=false --set components.policies=false --set components.backups=false"; do
            # shellcheck disable=SC2086 # word splitting intended
            helm template platform deploy/argocd/platform $args | lint_argocd
          done
          # The vendored metrics-server manifest with its kind patch (Argo CD runs kustomize).
          kubectl kustomize deploy/platform/metrics-server | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.37.0 -
          # The dev tools' routes (deploy/kind/tools; step 3c uses them).
          docker run --rm -v "$PWD/deploy/kind/tools:/t:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" /t

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: needs.scope.outputs.full == 'true'
        with:
          cluster_name: shortly
          config: deploy/kind/cluster.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.scope.outputs.full == 'true'

      - name: Build image
        if: needs.scope.outputs.full == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: shortly:e2e
          cache-from: type=gha

      - name: Platform through Argo CD; namespaces, Postgres, secrets
        if: needs.scope.outputs.full == 'true'
        run: scripts/cluster.sh up
        env:
          # Argo CD syncs the platform from this commit (the PR's head: a merge commit only
          # exists on GitHub's side under a ref Argo CD doesn't fetch).
          PLATFORM_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ARGOCD_APPS: "0" # Argo CD doesn't manage the app yet: e2e step 12 does that
          POLICIES: ${{ matrix.policies }}
          BACKUPS: ${{ matrix.backups }}

      # Where the platform's start-up time goes: each image pull (from the kubelet's events)
      # and each pod's time from creation to Ready. The baseline for making set-up faster.
      - name: Platform start-up report
        if: needs.scope.outputs.full == 'true'
        run: |
          echo "== image pulls, slowest first (they overlap: pods pull in parallel)"
          kubectl get events -A -o json | jq -r '
            def secs: if test("ms$") then (.[:-2] | tonumber) / 1000
              else capture("^((?<m>[0-9]+)m)?(?<s>[0-9.]+)s$") | ((.m // "0") | tonumber) * 60 + (.s | tonumber) end;
            .items[] | select(.reason == "Pulled") | .message | select(startswith("Successfully pulled"))
            | capture("image \"(?<image>[^\"]+)\" in (?<d>[0-9.hms]+) ") | "\(.d | secs)\t\(.image)"' \
            | sort -rn | awk -F'\t' '{ printf "%7.1fs  %s\n", $1, $2; t += $1; n++ } END { printf "%7.1fs  summed over %d pulls\n", t, n }'
          echo "== pods: seconds from creation to Ready, slowest first"
          kubectl get pods -A -o json | jq -r '.items[]
            | (.status.conditions // [] | map(select(.type == "Ready" and .status == "True")) | first) as $ready
            | select($ready) | "\(($ready.lastTransitionTime | fromdateiso8601) - (.metadata.creationTimestamp | fromdateiso8601))\t\(.metadata.namespace)/\(.metadata.name)"' \
            | sort -rn | awk -F'\t' 'NR <= 15 { printf "%5ds  %s\n", $1, $2 }'

      # When a sync never finishes, the job's timeout kills the wait before it can explain.
      - name: Argo CD state (on failure)
        if: (failure() || cancelled()) && needs.scope.outputs.full == 'true'
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl -n argocd get applications -o jsonpath='{range .items[*]}{"== "}{.metadata.name}{" "}{.status.sync.status}/{.status.health.status}{"\n"}{range .status.conditions[*]}  {.type}: {.message}{"\n"}{end}{range .status.resources[?(@.health.status!="Healthy")]}  {.health.status}: {.kind}/{.namespace}/{.name} {.health.message}{"\n"}{end}{.status.operationState.phase}: {.status.operationState.message}{"\n"}{end}' || true
          kubectl get pods -A | grep -vE "Running|Completed" || true
          # Why each restarted container last stopped (OOMKilled, Error...).
          kubectl get pods -A -o jsonpath='{range .items[*]}{range .status.containerStatuses[?(@.restartCount>0)]}{.name}: {.restartCount} restarts, last {.lastState.terminated.reason} (exit {.lastState.terminated.exitCode}){"\n"}{end}{end}' || true
          kubectl -n argocd logs statefulset/argocd-application-controller --previous --tail=30 || true
          kubectl -n argocd logs deploy/argocd-repo-server --tail=40 || true

      - name: Deploy, promote, rollback drill
        if: needs.scope.outputs.full == 'true'
        run: scripts/k8s-e2e.sh
        env:
          IMAGE: shortly:e2e
          E2E_SUITE: ${{ matrix.suite }}
          # Step 12 has Argo CD deploy prod from this exact commit (the PR's head, which
          # GitHub serves; the merge commit CI checks out is not fetchable by Argo CD).
          GITOPS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

  # The one required status check (ruleset main-rules requires `ci` only). It passes when
  # every job above passed, docs-only skips included, so jobs can be split, renamed or moved
  # into reusable workflows without a ruleset change. Add a new job to `needs` or it isn't
  # gating anything.
  gate:
    name: ci
    if: always()
    needs: [scope, check, image, k8s]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
