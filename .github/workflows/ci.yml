name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN can write to the repo; CI only needs to read.
permissions:
  contents: read

# A new push to the same PR/branch cancels the now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs: tags are mutable, SHAs are not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests/test_gitops.py checks prod's digest against everything
          # staging has run on main.
          fetch-depth: 0

      # Docs-only PRs skip the work (scripts/ci-scope.sh says why the job still runs).
      - name: Does this change need the checks?
        id: scope
        run: scripts/ci-scope.sh

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.full == 'true'
        with:
          enable-cache: true # Python version comes from .python-version

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.scope.outputs.full == 'true'
        with:
          version: v4.3.1 # tests/test_platform.py renders the platform chart

      - name: Install (fails if uv.lock is stale)
        if: steps.scope.outputs.full == 'true'
        run: uv sync --locked

      - name: Format check
        if: steps.scope.outputs.full == 'true'
        run: uv run ruff format --check .

      - name: Lint
        if: steps.scope.outputs.full == 'true'
        run: uv run ruff check .

      - name: Type check
        if: steps.scope.outputs.full == 'true'
        run: uv run mypy src tests

      - name: Test
        if: steps.scope.outputs.full == 'true'
        run: uv run pytest --cov-fail-under=90
        env:
          # gh verifies the released image's provenance (tests/test_deploy_gate.py); the
          # read-only token is enough: the attestation bundle comes from the registry.
          GH_TOKEN: ${{ github.token }}
  image:
    name: build, scan, smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its first parent, for scripts/ci-scope.sh

      # Docs-only PRs skip the work (scripts/ci-scope.sh says why the job still runs).
      - name: Does this change need the checks?
        id: scope
        run: scripts/ci-scope.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.full == 'true'

      - name: Build
        if: steps.scope.outputs.full == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true # into the local daemon, so the next steps can use it
          tags: shortly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail on HIGH/CRITICAL vulns that have a fix available. Unfixed ones can't be
      # acted on yet, and failing on them just trains people to ignore the scanner.
      - name: Scan image
        if: steps.scope.outputs.full == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shortly:ci
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test
        if: steps.scope.outputs.full == 'true'
        run: scripts/smoke.sh
        env:
          SHORTLY_IMAGE: shortly:ci
  
  # Two kind clusters in parallel, each running half of the e2e drills (E2E_SUITE in
  # scripts/k8s-e2e.sh): the platform checks plus GitOps, and the delivery drills (rollbacks
  # and canaries). One cluster ran them in about 14 minutes; two take about 8.
  k8s:
    name: kind e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # usually about 8; a hung drill shouldn't hold a runner
    strategy:
      fail-fast: false # a failure in one half shouldn't hide the other half's result
      matrix:
        include:
          # Platform: everything.
          - { suite: platform, argocd: "1", policies: "1", backups: "1" }
          # Delivery: no Argo CD, admission policies or backups (unused there).
          - { suite: delivery, argocd: "0", policies: "0", backups: "0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its first parent (main), to diff them

      # Docs-only PRs skip the work (scripts/ci-scope.sh says why the job still runs).
      - name: Does this change need the checks?
        id: scope
        run: scripts/ci-scope.sh

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.scope.outputs.full == 'true'
        with:
          version: v4.3.1 # deploy.sh uses Helm 4 flags (--rollback-on-failure)

      - name: Lint and schema-validate the chart
        if: steps.scope.outputs.full == 'true'
        run: |
          helm lint deploy/helm/shortly --set image.tag=ci
          # --api-versions renders the ServiceMonitor/PrometheusRule (normally only rendered
          # where the CRDs exist); their schemas come from the CRDs catalog, pinned by commit.
          crds=https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce
          for env in staging prod; do
            helm template shortly deploy/helm/shortly -n "$env" -f "deploy/envs/$env.yaml" --set image.tag=ci \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              --api-versions monitoring.coreos.com/v1/PrometheusRule \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.37.0 \
                  -schema-location default \
                  -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          done
          # The Kyverno admission policies (their verdicts are tested by pytest and step 8).
          docker run --rm -v "$PWD/deploy/policies:/p:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" /p
          # The Argo CD projects and Applications: the app's (step 12 applies them for real),
          # the platform's root, and the child Applications the platform chart renders, with
          # every component on and with every one off.
          lint_argocd() { docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -; }
          awk 'FNR == 1 { print "---" } 1' deploy/argocd/*.yaml | lint_argocd # one document stream
          helm lint deploy/argocd/platform
          for args in "" "--set components.monitoring=false --set components.policies=false --set components.backups=false"; do
            # shellcheck disable=SC2086 # word splitting intended
            helm template platform deploy/argocd/platform $args | lint_argocd
          done
          # The vendored metrics-server manifest with its kind patch (Argo CD will run kustomize).
          kubectl kustomize deploy/platform/metrics-server | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.37.0 -
          # The dev tools' routes (deploy/kind/tools; step 3c uses them).
          docker run --rm -v "$PWD/deploy/kind/tools:/t:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location "$crds/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" /t

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.scope.outputs.full == 'true'
        with:
          cluster_name: shortly
          config: deploy/kind/cluster.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.full == 'true'

      - name: Build image
        if: steps.scope.outputs.full == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: shortly:e2e
          cache-from: type=gha

      - name: Namespaces, Postgres, secrets
        if: steps.scope.outputs.full == 'true'
        run: scripts/cluster.sh up
        env:
          ARGOCD: ${{ matrix.argocd }}
          ARGOCD_APPS: "0" # where installed, Argo CD doesn't manage the app yet: e2e step 12 does that
          POLICIES: ${{ matrix.policies }}
          BACKUPS: ${{ matrix.backups }}

      - name: Deploy, promote, rollback drill
        if: steps.scope.outputs.full == 'true'
        run: scripts/k8s-e2e.sh
        env:
          IMAGE: shortly:e2e
          E2E_SUITE: ${{ matrix.suite }}
          # Step 12 has Argo CD deploy prod from this exact commit (the PR's head, which
          # GitHub serves; the merge commit CI checks out is not fetchable by Argo CD).
          GITOPS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

  # The required status check (ruleset main-rules) has this name: one result for both kind
  # jobs, so splitting or reshaping them never needs a ruleset change.
  k8s-result:
    name: deploy to kind, rollback drill
    if: always()
    needs: k8s
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Both kind jobs passed (or were skipped as docs-only)
        env:
          RESULT: ${{ needs.k8s.result }}
        run: |
          echo "kind e2e: $RESULT"
          [[ "$RESULT" == success ]]
