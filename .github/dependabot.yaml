# Pinned versions only stay safe if something bumps them. Dependabot opens PRs; CI
# (including the image scan and smoke test) decides whether they're safe to merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps: # one PR per week instead of one per package
        patterns: ["*"]

  - package-ecosystem: github-actions # bumps the pinned SHAs (and their # vX comments)
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker # bumps the base image digest in the Dockerfile
    directory: /
    schedule:
      interval: weekly
