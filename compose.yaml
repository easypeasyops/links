# Three ways to use this file:
#   docker compose up -d --wait                        # just Postgres; run the app with `uv run shortly`
#   docker compose --profile app up -d --build --wait  # the full stack, as it runs in production
#   docker compose --profile app --profile obs up -d --build --wait
#       # + Prometheus (http://localhost:9090) and Jaeger (http://localhost:16686)
services:
  postgres:
    image: postgres:17-alpine # keep in sync with POSTGRES_IMAGE in tests/conftest.py
    environment:
      POSTGRES_USER: shortly
      POSTGRES_PASSWORD: dev # local-only credential; never reuse outside this file
      POSTGRES_DB: shortly
    ports:
      - "127.0.0.1:5432:5432" # bind to loopback, not all interfaces
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortly -d shortly"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: apply migrations, then exit. The app waits for it to *succeed*.
  # In Kubernetes this becomes a Job (or Helm pre-upgrade hook), not an init step in
  # every replica — N replicas racing to migrate the same schema is a classic outage.
  migrate:
    profiles: [app]
    image: ${SHORTLY_IMAGE:-shortly:dev}
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      SHORTLY_DATABASE_URL: postgresql://shortly:dev@postgres:5432/shortly
      SHORTLY_BASE_URL: http://localhost:8000
      SHORTLY_DB_POOL_SIZE: ${SHORTLY_DB_POOL_SIZE:-5} # load tests vary this
      SHORTLY_MAX_CONCURRENT_REQUESTS: ${SHORTLY_MAX_CONCURRENT_REQUESTS:-16} # and this
      # scripts/loadtest.sh's k6 stands in for an ingress and sends X-Forwarded-For to
      # simulate many clients, so the compose network is trusted. Local use only.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      # Tracing is on only when an endpoint is set. With the obs profile running:
      #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile app --profile obs up -d
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: [app]
    image: ${SHORTLY_IMAGE:-shortly:dev}
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9100:9100" # /metrics lives on its own port (SHORTLY_METRICS_PORT)
    read_only: true # the app never writes to its filesystem; enforce it
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 25s # > uvicorn --timeout-graceful-shutdown (20s)
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.15.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/helm/shortly/rules:/etc/prometheus/rules:ro # the chart's alert rules
    ports:
      - "127.0.0.1:9090:9090"

  jaeger: # all-in-one: OTLP receiver + storage + UI, in memory. Local use only.
    profiles: [obs]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686" # UI

volumes:
  pgdata:
