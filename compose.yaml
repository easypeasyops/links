# Two ways to use this file:
#   docker compose up -d --wait                      # just Postgres; run the app with `uv run shortly`
#   docker compose --profile app up -d --build --wait  # the full stack, as it runs in production
services:
  postgres:
    image: postgres:17-alpine # keep in sync with POSTGRES_IMAGE in tests/conftest.py
    environment:
      POSTGRES_USER: shortly
      POSTGRES_PASSWORD: dev # local-only credential; never reuse outside this file
      POSTGRES_DB: shortly
    ports:
      - "127.0.0.1:5432:5432" # bind to loopback, not all interfaces
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortly -d shortly"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: apply migrations, then exit. The app waits for it to *succeed*.
  # In Kubernetes this becomes a Job (or Helm pre-upgrade hook), not an init step in
  # every replica — N replicas racing to migrate the same schema is a classic outage.
  migrate:
    profiles: [app]
    image: ${SHORTLY_IMAGE:-shortly:dev}
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      SHORTLY_DATABASE_URL: postgresql://shortly:dev@postgres:5432/shortly
      SHORTLY_BASE_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: [app]
    image: ${SHORTLY_IMAGE:-shortly:dev}
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true # the app never writes to its filesystem; enforce it
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 25s # > uvicorn --timeout-graceful-shutdown (20s)
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
