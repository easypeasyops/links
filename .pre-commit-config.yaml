repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0            # pin; let Renovate/Dependabot bump it
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
