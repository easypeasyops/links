# The monitoring UIs through the Gateway's `tools` listener (deploy/kind/gateway.yaml).
# Deployed by Argo CD (the platform's `tool-routes` Application) when monitoring is on.
#   http://grafana.localhost:8090  http://prometheus.localhost:8090  http://alertmanager.localhost:8090
# Each one's externalUrl / root_url (deploy/kind/monitoring-values.yaml) is the same address,
# so links in alerts and dashboards open here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - { name: shortly, namespace: gateway, sectionName: tools }
  hostnames: [grafana.localhost]
  rules:
    - backendRefs:
        - { name: grafana, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - { name: shortly, namespace: gateway, sectionName: tools }
  hostnames: [prometheus.localhost]
  rules:
    - backendRefs:
        - { name: kps-prometheus, port: 9090 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - { name: shortly, namespace: gateway, sectionName: tools }
  hostnames: [alertmanager.localhost]
  rules:
    - backendRefs:
        - { name: kps-alertmanager, port: 9093 }
