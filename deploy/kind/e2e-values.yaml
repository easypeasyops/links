# Test-only values that scripts/k8s-e2e.sh adds to every deploy (DEPLOY_EXTRA_VALUES), and
# to the Argo CD Application in step 12. Same logic as production, shorter clocks:
#   - Prometheus scrapes the app every 5 s instead of 15 s, so a new canary pod has data
#     within seconds of starting;
#   - canary analysis: 20 s delay, then 2 checks 10 s apart (production: 60 s, 4 x 30 s).
# Together they take a canary drill from about 3 minutes to about 1.
monitoring:
  scrapeInterval: 5s
canary:
  analysis:
    initialDelay: 20s
    interval: 10s
    count: 2
