# Argo CD for the kind cluster, bootstrapped by scripts/cluster.sh (the one component not
# deployed from git): GitOps for the app's two environments and for the platform under
# them (deploy/argocd/). One replica of everything, no SSO, no notifications: a laptop, not a
# team. The UI is at http://argocd.localhost:8090, through the Gateway's tools listener
# (deploy/kind/tools/argocd.yaml).
global:
  domain: argocd.localhost:8090

configs:
  params:
    # No TLS between the browser and the server: the front door listens on 127.0.0.1 only
    # (scripts/cluster.sh). Never on a cluster where the server is exposed.
    server.insecure: true
    # Keep each resource's health in the Application (.status.resources[].health): Argo CD
    # 3 stopped writing it there by default. scripts/cluster.sh's progress lines, its
    # failure output and CI's "Argo CD state" step read it to say what is Degraded and why.
    # Costs more Application updates; nothing at this size.
    controller.resource.health.persist: "true"
  cm:
    # Check the repository for changes every 60 s instead of 180 s: a merged promotion PR
    # reaches the cluster within a minute. (A webhook from GitHub would make it instant;
    # it needs the server reachable from the internet, which a laptop isn't.)
    timeout.reconciliation: 60s
    # Admin login for the UI on a laptop; the generated password is in the Secret
    # argocd-initial-admin-secret.
    admin.enabled: true
    statusbadge.enabled: false
    exec.enabled: false
    # Report an Application's own health, so the platform root's sync waves wait for each
    # wave's children to be Healthy before the next (Argo CD dropped this default in 1.8).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

dex:
  enabled: false # no SSO
notifications:
  enabled: false
applicationSet:
  replicas: 1 # generates every app's Applications from the platform repo's apps/ (platform plan 3.3)

controller:
  replicas: 1
  # The metrics Service; the ServiceMonitor and the alerts on Argo CD come with the
  # platform (deploy/argocd/platform/templates/monitoring.yaml), once the monitoring
  # CRDs exist. Argo CD is installed before them, so it can't ship its own.
  metrics:
    enabled: true
  # It caches every resource it manages. 768Mi was enough for the app; with the platform
  # (kube-prometheus-stack, Kyverno, Envoy Gateway and their large CRDs) it crash-looped in
  # CI, and nothing synced while it was down.
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
server:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
repoServer:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
redis:
  # The chart pulls Redis from ECR Public, which refuses anonymous pulls from shared runner
  # addresses once their data limit is hit (CI failed with ImagePullBackOff, from both
  # ecr-public.aws.com and public.ecr.aws). The same official image from Docker Hub, where
  # postgres:17-alpine already comes from, pinned by the same digest.
  image:
    repository: docker.io/library/redis
    tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
