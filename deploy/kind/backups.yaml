# LOCAL ONLY: S3-compatible object storage for Postgres backups, in its own namespace.
# Applied by scripts/cluster.sh. In a real cloud this is a bucket (S3, GCS) in another
# account or region, with versioning and object lock, and the database is a managed one
# whose provider also takes continuous (point-in-time) backups.
#
# SeaweedFS rather than MinIO: MinIO's community images stopped in Oct 2025 and its
# repository is archived. SeaweedFS (Apache-2.0) serves S3 from one process.
#
# Backups live apart from what they protect: a namespace (and in a real setup an account)
# of their own, reachable only by backup and restore pods (NetworkPolicy below).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: { app: seaweedfs }
  ports: [{ name: s3, port: 8333 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          # 4.48, pinned by digest (the tag is what it is, the digest that it can't change).
          image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          command: [/usr/bin/weed]
          args:
            - server # master + volume + filer + S3 gateway in one process
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=64 # small volumes: the PVC is 1 Gi
            - -volume.max=0 # as many volumes as the disk allows
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json # the one identity backups use
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ name: s3, containerPort: 8333 }]
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: s3-config
          secret: { secretName: seaweedfs-s3 } # generated by cluster.sh, never in git
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
# Nothing reaches the bucket except backup and restore pods (label component=backup) from
# the app namespaces and the restore drill's scratch namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [staging, prod, restore-drill] }
          podSelector:
            matchLabels: { app.kubernetes.io/component: backup }
      ports:
        - { port: 8333, protocol: TCP }
