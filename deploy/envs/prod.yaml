# Production: autoscaled (chart defaults), never below two replicas so a rollout, drain,
# or crash never drops to zero. maxReplicas is capped to what a laptop kind node can hold.
autoscaling:
  minReplicas: 2
  maxReplicas: 4
config:
  baseUrl: "http://sho.rt.localhost"
  logLevel: INFO
  # kind has no ingress: in-cluster load generators (scripts/hpa-drill.sh) stand in for it
  # and send X-Forwarded-For to simulate many clients. kind's pod network, so ANY pod here
  # can pick its client IP. On a real cluster: the ingress controller's addresses only.
  forwardedAllowIps: "10.244.0.0/16"
podDisruptionBudget:
  enabled: true
  minAvailable: 1
monitoring:
  enabled: true
  clusterWide: true # this release ships the alert rules and dashboard for the cluster
