# Admission control, the layer after scripts/deploy.sh: the API server itself refuses any Pod
# that runs one of our images without a valid release attestation, so hand-run helm or
# kubectl can't bypass the gate. Deployments, StatefulSets, Jobs... are checked too (autogen), so a bad
# rollout is refused at `kubectl apply`, not as a ReplicaSet that silently can't create pods.
#
# Same rules as scripts/verify-image.sh:
#   - SLSA provenance, signed keylessly via GitHub Actions' OIDC issuer, logged in Rekor
#   - keyed by identity, not by app: an image ghcr.io/statsguy/<repo> must be signed by
#     statsguy/<repo>'s release.yml running at a vX.Y.Z tag. The signer check accepts any
#     statsguy repo's release workflow; a validation then requires the repository named in
#     the signed provenance to be the image's own, so one repo can't vouch for another's
#     images. A new app is covered without editing this policy.
#   - the build was a GitHub Actions workflow build
#   - by digest only: tags are refused, not resolved (mutateDigest: false)
# Deployed by Argo CD (the platform's `kyverno-policies` Application), proven by tests/test_admission_policies.py (offline cases
# and the real registry) and in the cluster by scripts/admission-check.sh.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-release-provenance
  annotations:
    policies.kyverno.io/title: Require release provenance for our images
    policies.kyverno.io/description: >-
      Images from ghcr.io/statsguy/<repo> must be referenced by digest and carry SLSA
      provenance signed by statsguy/<repo>'s release workflow at a release tag.
spec:
  validationActions: [Deny]
  # Admission only. In the background the reports controller re-verified every running
  # image against the registry and Rekor, over and over: about 1.1 cores on
  # average and bursts of 9 on the kind node, which slowed every request in the cluster
  # (2026-10-24: 49% of creates over 100 ms in one burst). A pod's image can't change
  # after admission, so a background re-check adds no safety for this rule.
  evaluation:
    background:
      enabled: false
  failurePolicy: Fail # if verification can't run (Kyverno down, registry or Rekor unreachable): refuse
  webhookConfiguration:
    timeoutSeconds: 30 # registry + Rekor round trips; the API server's maximum
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        # Old and per-app namespace names, during the move (platform plan, Phase 2).
        - { key: kubernetes.io/metadata.name, operator: In, values: [staging, prod, shortly-staging, shortly-prod] }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # Also check the Pod templates of these (explicit, not left to a default): a bad rollout
  # is refused at `kubectl apply` / `helm upgrade`, instead of a ReplicaSet that silently
  # can't create pods.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, jobs, cronjobs, replicasets, daemonsets]
  matchImageReferences:
    - glob: "ghcr.io/statsguy/*"
  validationConfigurations:
    mutateDigest: false # don't quietly turn a tag into a digest...
    verifyDigest: true # ...require one
    required: true
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/statsguy/[A-Za-z0-9_.-]+/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    # actions/attest-build-provenance pushes a Sigstore bundle holding an in-toto statement.
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    # Every image in the Pod that matchImageReferences selects, init and ephemeral included.
    - name: ownImages
      expression: >-
        (images.containers + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([]))
        .filter(image, image.startsWith('ghcr.io/statsguy/'))
  validations:
    - expression: >-
        variables.ownImages.all(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.release]) > 0)
      message: >-
        ghcr.io/statsguy images must be a release digest with provenance from a
        statsguy release.yml at a vX.Y.Z tag (see RUNBOOK: Admission policy)
    # The signer check above accepts any statsguy repo's release workflow: the provenance
    # must also name the image's own repository (ghcr.io/statsguy/<repo> -> statsguy/<repo>).
    - expression: >-
        variables.ownImages.all(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.externalParameters.workflow.repository ==
          'https://github.com/' + image.split('@')[0].substring(8))
      message: >-
        provenance names a different repository than the image's: ghcr.io/statsguy/<repo>
        must be built by statsguy/<repo>
    - expression: >-
        variables.ownImages.all(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.buildType ==
          'https://actions.github.io/buildtypes/workflow/v1')
      message: provenance is not from a GitHub Actions workflow build
