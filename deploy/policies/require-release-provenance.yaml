# Admission control, the layer after scripts/deploy.sh: the API server itself refuses any Pod
# that runs a shortly image without a valid release attestation, so hand-run helm or kubectl
# can't bypass the gate. Deployments, StatefulSets, Jobs... are checked too (autogen), so a bad
# rollout is refused at `kubectl apply`, not as a ReplicaSet that silently can't create pods.
#
# Same rules as scripts/verify-image.sh:
#   - SLSA provenance, signed keylessly via GitHub Actions' OIDC issuer, logged in Rekor
#   - signer = this repo's release.yml, running at a vX.Y.Z tag
#   - the build was a GitHub Actions workflow build
#   - by digest only: tags are refused, not resolved (mutateDigest: false)
# Installed by scripts/cluster.sh, proven by tests/test_admission_policies.py (offline cases
# and the real registry) and in the cluster by scripts/admission-check.sh.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: shortly-require-release-provenance
  annotations:
    policies.kyverno.io/title: Require release provenance for shortly images
    policies.kyverno.io/description: >-
      Images from ghcr.io/statsguy/shortly must be referenced by digest and carry SLSA
      provenance signed by statsguy/shortly's release workflow at a release tag.
spec:
  validationActions: [Deny]
  failurePolicy: Fail # if verification can't run (Kyverno down, registry or Rekor unreachable): refuse
  webhookConfiguration:
    timeoutSeconds: 30 # registry + Rekor round trips; the API server's maximum
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: In, values: [staging, prod] }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # Also check the Pod templates of these (explicit, not left to a default): a bad rollout
  # is refused at `kubectl apply` / `helm upgrade`, instead of a ReplicaSet that silently
  # can't create pods.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, jobs, cronjobs, replicasets, daemonsets]
  matchImageReferences:
    - glob: "ghcr.io/statsguy/shortly*"
  validationConfigurations:
    mutateDigest: false # don't quietly turn a tag into a digest...
    verifyDigest: true # ...require one
    required: true
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/statsguy/shortly/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    # actions/attest-build-provenance pushes a Sigstore bundle holding an in-toto statement.
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    # Every image in the Pod that matchImageReferences selects, init and ephemeral included.
    - name: shortlyImages
      expression: >-
        (images.containers + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([]))
        .filter(image, image.startsWith('ghcr.io/statsguy/shortly'))
  validations:
    - expression: >-
        variables.shortlyImages.all(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.release]) > 0)
      message: >-
        shortly images must be a release digest with provenance from
        statsguy/shortly release.yml at a vX.Y.Z tag (see RUNBOOK: Admission policy)
    - expression: >-
        variables.shortlyImages.all(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.buildType ==
          'https://actions.github.io/buildtypes/workflow/v1')
      message: provenance is not from a GitHub Actions workflow build
