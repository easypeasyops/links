# The other half of require-release-provenance: that policy checks shortly's images, so an
# attacker would simply run a different image. This one allows only known images in the app
# namespaces at all.
#
# Audit in kind: local builds (shortly:dev, shortly:e2e) are how this cluster is developed and
# tested, so violations are only reported (kubectl get policyreport -A). On a real cluster use
# validationActions: [Deny]. Tested offline by tests/test_admission_policies.py.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: shortly-allowed-images
  annotations:
    policies.kyverno.io/title: Only allow known images in the app namespaces
    policies.kyverno.io/description: >-
      Pods in staging and prod may only run shortly's released image (by digest), Postgres,
      or the k6 load-test image.
spec:
  validationActions: [Audit]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: In, values: [staging, prod] }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: images
      expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])
         + object.spec.?ephemeralContainers.orValue([])).map(c, c.image)
    - name: allowed
      # Regexes, anchored. Postgres and k6 are pinned to their major line.
      expression: >-
        [
          '^ghcr\\.io/statsguy/shortly@sha256:[0-9a-f]{64}$',
          '^(docker\\.io/(library/)?)?postgres:17-alpine(@sha256:[0-9a-f]{64})?$',
          '^(docker\\.io/)?grafana/k6:[0-9.]+(@sha256:[0-9a-f]{64})?$'
        ]
  validations:
    - expression: variables.images.all(i, variables.allowed.exists(r, i.matches(r)))
      messageExpression: >-
        'image not allowed in staging/prod: ' +
        variables.images.filter(i, !variables.allowed.exists(r, i.matches(r))).join(', ')
