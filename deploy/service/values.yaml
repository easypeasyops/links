# shortly's values for the platform's service chart (easypeasyops/platform charts/service),
# shared by every environment. Since platform plan 3.3, Argo CD renders shortly from that
# chart, pinned by digest, with these values from this repo, layered as
#   deploy/service/values.yaml            this file (hand-written)
#   deploy/service/slo-rules.values.yaml  SLO rules, generated from deploy/prometheus/slos.yaml
#                                         by the platform's scripts/gen_slo_rules.py --values
#   deploy/envs/<env>.yaml                the environment's settings and image digest
#
# monitoring.rules.shortly is deploy/prometheus/rules/shortly.yaml as text (promtool and the
# local Prometheus read the file; tests/test_service_values.py keeps the two equal).

app:
  name: shortly
  partOf: shortly

image:
  repository: ghcr.io/statsguy/shortly

# Non-secret config. Becomes SHORTLY_* environment variables.
config:
  baseUrl: "https://sho.rt"
  logLevel: INFO
  # Measured: median 1, peak 4 connections in use at ~300 req/s per pod; 1 was too few.
  dbPoolSize: 5
  # Wait this long for a free connection, then shed with 503 + Retry-After (not 30 s).
  dbPoolTimeoutSeconds: 1
  # Postgres cancels a statement running longer than this, or waiting on a row lock longer
  # than dbLockTimeoutMs; the request gets a 503 + Retry-After instead of holding a
  # connection. The slowest real query is a few ms, so 2 s only catches a sick database.
  dbStatementTimeoutMs: 2000
  dbLockTimeoutMs: 1000
  # Requests one pod works on at once; more are answered 503 + Retry-After in ~1 ms instead
  # of queueing until every request is slow. Sized from the load test (docs/DESIGN.md,
  # Capacity): well above what a pod needs at capacity, well below a queue of seconds.
  maxConcurrentRequests: 16
  # DRILLS ONLY: this share (0-1) of creates and redirects fails with 500 while probes stay
  # green, i.e. a release that is ready but broken. The canary drill sets it to prove that
  # analysis catches such a release. Never set in deploy/envs/. 0 renders no variable at all.
  faultErrorRatio: 0
  # /metrics is served on this port, not the app port: the Service exposes it to Prometheus
  # only, and the NetworkPolicy below admits nothing else to it.
  metricsPort: 9100
  # Per-client limit on POST /links: a burst, then a sustained rate (0 turns it off).
  # Exact across replicas: the state lives in Postgres (docs/DESIGN.md, Rate limiting).
  rateLimit:
    createsPerMinute: 60
    burst: 20
  # Peers whose X-Forwarded-For uvicorn believes (comma-separated IPs or CIDRs). The
  # limiter keys on the client IP, so this must be exactly your ingress / load balancer:
  # anyone listed here can claim to be any client. Default: nobody but localhost.
  forwardedAllowIps: "127.0.0.1"

database:
  existingSecret: shortly-db

# The app's environment variables. The chart renders this list as it is, in order: which
# variables the app reads is the app's business, not the chart's. Each string is a template,
# so it can read other values (config.* above, which env files override). An entry with
# `when` is rendered only if `when` renders to something other than "", "0" or "false".
env:
  - name: SHORTLY_DATABASE_URL
    secret: { name: "{{ .Values.database.existingSecret }}", key: "{{ .Values.database.secretKey }}" }
  - { name: SHORTLY_BASE_URL, value: "{{ .Values.config.baseUrl }}" }
  - { name: SHORTLY_LOG_LEVEL, value: "{{ .Values.config.logLevel }}" }
  - { name: SHORTLY_DB_POOL_SIZE, value: "{{ .Values.config.dbPoolSize }}" }
  - { name: SHORTLY_METRICS_PORT, value: "{{ .Values.config.metricsPort }}" }
  - { name: SHORTLY_DB_POOL_TIMEOUT_SECONDS, value: "{{ .Values.config.dbPoolTimeoutSeconds }}" }
  - { name: SHORTLY_DB_STATEMENT_TIMEOUT_MS, value: "{{ .Values.config.dbStatementTimeoutMs }}" }
  - { name: SHORTLY_DB_LOCK_TIMEOUT_MS, value: "{{ .Values.config.dbLockTimeoutMs }}" }
  - { name: SHORTLY_MAX_CONCURRENT_REQUESTS, value: "{{ .Values.config.maxConcurrentRequests }}" }
  # DRILL: requests fail on purpose (config.faultErrorRatio)
  - name: SHORTLY_FAULT_ERROR_RATIO
    value: "{{ .Values.config.faultErrorRatio }}"
    when: "{{ .Values.config.faultErrorRatio }}"
  - { name: SHORTLY_RATE_LIMIT_CREATES_PER_MINUTE, value: "{{ .Values.config.rateLimit.createsPerMinute }}" }
  - { name: SHORTLY_RATE_LIMIT_BURST, value: "{{ .Values.config.rateLimit.burst }}" }
  - { name: FORWARDED_ALLOW_IPS, value: "{{ .Values.config.forwardedAllowIps }}" } # read by uvicorn itself
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "{{ .Values.otel.endpoint }}"
    when: "{{ .Values.otel.endpoint }}"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "deployment.environment.name={{ .Values.environment | default .Release.Namespace }}"
    when: "{{ .Values.otel.endpoint }}"

migrations:
  enabled: true
  # The app's migration command. shortly's: `alembic upgrade head`, except when the
  # database is AHEAD of this image: its revision is one this release doesn't know, which
  # happens exactly on a rollback (a reverted promotion, or an older digest redeployed).
  # Expand/contract makes the old code work on the newer schema, so the right move is to
  # leave it alone. (Helm skipped hooks on `helm rollback`; Argo CD runs them on every sync.)
  command:
    - sh
    - -c
    - |
      out=$(alembic upgrade head 2>&1); rc=$?
      printf '%s\n' "$out"
      if [ "$rc" -ne 0 ] && printf '%s' "$out" | grep -q "Can't locate revision identified by"; then
        echo "migrate: the database is at a newer revision than this release (a rollback); schema left as it is"
        exit 0
      fi
      exit "$rc"

# Sizing comes from the load test (docs/DESIGN.md, Capacity; re-run scripts/loadtest.sh
# when the request path changes). One pod: ~2 ms CPU per request, meets the latency SLO up
# to ~250 req/s, saturates near 1 core. Target 70% of a 500m request = ~170 req/s per pod,
# leaving ~30% headroom for traffic that grows while new pods start.
autoscaling:
  enabled: true
  minReplicas: 2 # survive one pod loss / a drain; the PDB keeps 1 up
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Rendering fails if maxReplicas x config.dbPoolSize exceeds this. Postgres default
  # max_connections is 100; keep room for migrations, admin sessions and the other env.
  maxDbConnections: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # react to a spike at once
      policies:
        - { type: Percent, value: 100, periodSeconds: 15 } # at most double every 15 s
        - { type: Pods, value: 4, periodSeconds: 15 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300 # scale in only after 5 quiet minutes: no flapping
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }

resources:
  requests:
    cpu: 500m # measured ~0.5 cores at 250 req/s; also the HPA's 100%
    memory: 128Mi
  limits:
    # No CPU limit on purpose: CPU limits cause throttling even when the node is idle.
    # Memory limit stays: a leak should OOM-kill one pod, not the node.
    memory: 256Mi

cronJobs:
  # Expired-link cleanup (python -m shortly.cleanup). Links expired less than
  # SHORTLY_CLEANUP_GRACE_DAYS ago are kept, so they still answer 410 Gone. Bounded batches,
  # each one short statement that commits on its own: one run deletes at most
  # BATCH_SIZE x MAX_BATCHES rows, and a bigger backlog is finished by the next runs. A
  # manual run may overlap a scheduled one, which SKIP LOCKED makes safe.
  cleanup:
    schedule: "17 * * * *" # hourly, off the top of the hour when every other job runs
    command: ["python", "-m", "shortly.cleanup"]
    activeDeadlineSeconds: 900
    env:
      - { name: SHORTLY_CLEANUP_GRACE_DAYS, value: "7" }
      - { name: SHORTLY_CLEANUP_BATCH_SIZE, value: "1000" }
      - { name: SHORTLY_CLEANUP_MAX_BATCHES, value: "100" }
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 192Mi }

canary:
  analysis:
    latencyChecks:
      - name: redirect-p99
        selector: 'method="GET", route="/{code}"'
        maxP99Seconds: 0.25 # coarse: small samples make p99 noisy; 2 bad ones abort
    syntheticTraffic:
      script: |
        // Synthetic traffic for canary analysis (templates/analysistemplate.yaml): a steady mix of
        // redirects (90%) and creates (10%) through the Gateway, as users would arrive, so the
        // canary's share has requests to be judged on. It never fails on its own: errors are what
        // the analysis measures, not this script's business. Seeding retries until it has codes.
        //
        //   k6 run -e BASE_URL=... -e HOST=sho.rt.localhost -e RATE=20 -e DURATION=180s canary-traffic.js
        import http from "k6/http";
        import { sleep } from "k6";

        const BASE = __ENV.BASE_URL;
        const RATE = Number(__ENV.RATE || 20);
        const DURATION = __ENV.DURATION || "180s";
        const HOST = { Host: __ENV.HOST };
        const createRate = Math.max(1, Math.round(RATE / 10));

        export const options = {
          discardResponseBodies: true,
          scenarios: {
            redirects: {
              executor: "constant-arrival-rate", exec: "redirect", rate: RATE - createRate,
              timeUnit: "1s", duration: DURATION, preAllocatedVUs: 10, maxVUs: 50,
            },
            creates: {
              executor: "constant-arrival-rate", exec: "create", rate: createRate,
              timeUnit: "1s", duration: DURATION, preAllocatedVUs: 2, maxVUs: 10,
            },
          },
        };

        // A random client per create (RFC 2544 benchmark range), so the per-client rate limit
        // sees many clients, as in production. The app trusts X-Forwarded-For from the pod network.
        const client = () => `198.18.${Math.floor(Math.random() * 256)}.${1 + Math.floor(Math.random() * 254)}`;
        const createParams = () => ({
          headers: { ...HOST, "content-type": "application/json", "x-forwarded-for": client() },
          responseType: "text",
        });

        export function setup() {
          const codes = [];
          for (let i = 0; codes.length < 20 && i < 200; i++) {
            const res = http.post(`${BASE}/links`, JSON.stringify({ url: `https://example.com/canary/${i}` }), createParams());
            if (res.status === 201) codes.push(res.json("code"));
            else sleep(0.2);
          }
          return { codes };
        }

        export function redirect(data) {
          if (data.codes.length === 0) return;
          const code = data.codes[Math.floor(Math.random() * data.codes.length)];
          http.get(`${BASE}/${code}`, { redirects: 0, headers: HOST, tags: { name: "GET /{code}" } });
        }

        export function create() {
          http.post(`${BASE}/links`, JSON.stringify({ url: `https://example.com/canary/${__VU}/${__ITER}` }), createParams());
        }
monitoring:
  rules:
    shortly: |
      # Cause-based alerts for shortly, hand-written. The SLO alerts (slo.yaml, generated) say
      # "users are hurting"; these cover what an SLO cannot see, or warn before it is spent.
      # Every runbook_url anchor must exist in docs/RUNBOOK.md (tests/test_alert_rules.py checks).
      groups:
        - name: shortly-health
          rules:
            # The SLO is computed FROM the app's own metrics: if no pod is scraped, there is no
            # traffic data, every ratio is empty, and no burn-rate alert can fire. A full outage
            # would be silent without this one.
            - alert: ShortlyDown
              expr: sum(up{job="shortly"}) == 0 or absent(up{job="shortly"})
              for: 2m
              labels:
                severity: page
              annotations:
                summary: No shortly target is being scraped
                description: Prometheus has no healthy shortly target, so the SLO alerts are blind. Treat it as a full outage until proven otherwise.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#shortlydown

            # Needs kube-state-metrics. One environment with zero available pods is down, even
            # though another one is still being scraped (ShortlyDown only catches "nothing anywhere").
            # Counted over the ReplicaSets ("shortly-<pod hash>"), which a Deployment (staging) and
            # an Argo Rollout (prod) both create: kube-state-metrics knows nothing about Rollouts.
            - alert: ShortlyNoAvailablePods
              expr: sum by (namespace) (kube_replicaset_status_ready_replicas{replicaset=~"shortly-[a-z0-9]+"}) == 0
              for: 1m
              labels:
                severity: page
              annotations:
                summary: shortly has no available pods
                description: The Deployment or Rollout has zero ready replicas in this namespace, so every request to it fails.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#shortlynoavailablepods

            # Pods that fail readiness are removed from the Service. Users then get errors at the
            # load balancer, which the app never sees, so the availability SLI stays green.
            - alert: ShortlyNotReady
              expr: |-
                sum by (namespace) (rate(http_requests_total{route="/readyz", status="503"}[5m]))
                  / sum by (namespace) (rate(http_requests_total{route="/readyz"}[5m])) > 0.5
              for: 5m
              labels:
                severity: page
              annotations:
                summary: Most readiness checks are failing
                description: Over half of /readyz checks return 503 (usually the database is unreachable). Pods are out of rotation; user requests fail before they reach the app.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#pods-not-ready-readyz-returns-503

            # 503 + Retry-After because no DB connection freed up in time. Usually a slow database.
            # It also burns the availability budget; this alert names the cause.
            - alert: ShortlyLoadShedding
              # One alert per reason: "concurrency" is too much traffic for the pods (the HPA's
              # job), "pool" and "db_timeout" point at the database. Different fixes, so the
              # ticket says which.
              expr: sum by (namespace, reason) (rate(load_shed_total[5m])) > 0
              for: 5m
              labels:
                severity: ticket
              annotations:
                summary: Requests are being shed with 503 ({{ $labels.reason }})
                description: Requests have been shed for 5 minutes, reason {{ $labels.reason }}. concurrency means pods at their in-flight limit (traffic above capacity); pool or db_timeout mean a slow database. Check the database before adding replicas.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#saturation-load-shed-or-hpa-at-max

            # Needs kube-state-metrics in the cluster (not part of the local stack). At max, the
            # next traffic increase becomes latency: raise maxReplicas or add capacity.
            - alert: ShortlyAtMaxReplicas
              expr: |-
                kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="shortly"}
                  >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="shortly"}
              for: 15m
              labels:
                severity: ticket
              annotations:
                summary: The HPA has been at maxReplicas for 15 minutes
                description: Autoscaling has no headroom left. See Capacity in the design doc for the sizing rule and the DB connection budget.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#saturation-load-shed-or-hpa-at-max

            # 429s are the limiter working, so they never burn the availability SLO. A large,
            # sustained share is still worth a look: one client hammering creates (abuse, or a
            # buggy integration in a loop), or a limit too tight for many users behind one
            # address (corporate or carrier-grade NAT).
            - alert: ShortlyRateLimiting
              expr: |-
                sum by (namespace) (rate(rate_limited_total[15m]))
                  / sum by (namespace) (rate(http_requests_total{method="POST", route="/links"}[15m])) > 0.1
              for: 30m
              labels:
                severity: ticket
              annotations:
                summary: Over 10% of link creations are rate limited
                description: For 30 minutes, more than 1 in 10 POST /links requests got 429. Find out whether it is abuse or a limit that is too tight for legitimate clients.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#rate-limiting-429-on-post-links

            # Fault injection is for drills, which last minutes. Still on after 15 minutes means a
            # drill was abandoned or the setting leaked into a release: users are getting 500s on
            # purpose. The availability SLO burns too, but this names the cause.
            - alert: ShortlyFaultInjectionOn
              expr: sum by (namespace) (rate(faults_injected_total[5m])) > 0
              for: 15m
              labels:
                severity: ticket
              annotations:
                summary: Fault injection is failing requests on purpose
                description: SHORTLY_FAULT_ERROR_RATIO is set in {{ $labels.namespace }} and has been failing requests for 15 minutes. Remove config.faultErrorRatio and redeploy.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#fault-injection-left-on

            # Needs kube-state-metrics. A cron job that stops running fails silently: nothing
            # breaks for weeks, then the table is huge. Fires when the last success is over
            # 3 hours old (3 missed hourly runs), or the CronJob has existed for 3 hours
            # without ever succeeding (a new install whose first runs all fail).
            - alert: ShortlyCleanupNotRunning
              expr: |-
                time() - max by (namespace) (kube_cronjob_status_last_successful_time{cronjob="shortly-cleanup"}) > 3 * 3600
                  or (
                    time() - max by (namespace) (kube_cronjob_created{cronjob="shortly-cleanup"}) > 3 * 3600
                      unless max by (namespace) (kube_cronjob_status_last_successful_time{cronjob="shortly-cleanup"})
                  )
              for: 15m
              labels:
                severity: ticket
              annotations:
                summary: Expired-link cleanup hasn't succeeded for over 3 hours
                description: The shortly-cleanup CronJob has missed at least 3 runs, or has never succeeded. Expired links pile up until it runs again.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#cleanup-job-not-running

            # Needs kube-state-metrics. Backups that silently stopped are found during the
            # incident that needs them. Hourly job (RPO 1 h): fires after 2 missed runs, or if it
            # has never succeeded in 2 hours. Only where a postgres-backup CronJob exists (the
            # kind setup); a managed database's backups are watched through its provider.
            - alert: ShortlyBackupNotRunning
              expr: |-
                time() - max by (namespace) (kube_cronjob_status_last_successful_time{cronjob="postgres-backup"}) > 2 * 3600
                  or (
                    time() - max by (namespace) (kube_cronjob_created{cronjob="postgres-backup"}) > 2 * 3600
                      unless max by (namespace) (kube_cronjob_status_last_successful_time{cronjob="postgres-backup"})
                  )
              for: 15m
              labels:
                severity: ticket
              annotations:
                summary: Postgres backups haven't succeeded for over 2 hours
                description: The postgres-backup CronJob has missed at least 2 runs, or has never succeeded. Data written since the last good backup can't be recovered if the database is lost.
                runbook_url: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#backup-job-not-running
  # The platform's SLO dashboard is the chart's; its Runbook link is the SLO spec's.
  sloDashboard:
    runbookUrl: https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#slo-burn-rate-alerts
  dashboards:
    causes.json: |
      {
        "uid": "shortly-causes",
        "title": "shortly / Causes",
        "tags": [
          "shortly"
        ],
        "timezone": "browser",
        "description": "shortly's own cause metrics, beside the platform's SLO dashboard (shortly / SLOs): its DB connection pool and the requests it sheds.",
        "schemaVersion": 39,
        "version": 1,
        "editable": true,
        "refresh": "30s",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "datasource",
              "type": "datasource",
              "query": "prometheus",
              "label": "Data source",
              "current": {}
            },
            {
              "name": "namespace",
              "type": "query",
              "label": "Environment",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "query": {
                "query": "label_values(slo:sli_error:ratio_rate5m, namespace)",
                "refId": "ns"
              },
              "definition": "label_values(slo:sli_error:ratio_rate5m, namespace)",
              "refresh": 2,
              "current": {
                "text": "shortly-prod",
                "value": "shortly-prod"
              }
            }
          ]
        },
        "links": [
          {
            "title": "Runbook",
            "type": "link",
            "url": "https://github.com/statsguy/shortly/blob/main/docs/RUNBOOK.md#slo-burn-rate-alerts",
            "targetBlank": true
          }
        ],
        "panels": [
          {
            "id": 1,
            "type": "timeseries",
            "title": "DB pool in use",
            "description": "Connections checked out across all pods. In use near size with load shed rising: the database is slow, not the app.",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 12,
              "h": 8
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "sum(db_pool_in_use{namespace=\"$namespace\"})",
                "legendFormat": "in use"
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "sum(db_pool_size{namespace=\"$namespace\"})",
                "legendFormat": "size"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0
              },
              "overrides": []
            },
            "options": {}
          },
          {
            "id": 2,
            "type": "timeseries",
            "title": "Load shed",
            "description": "Requests rejected with 503 + Retry-After because no DB connection freed up within the pool timeout.",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "gridPos": {
              "x": 12,
              "y": 0,
              "w": 12,
              "h": 8
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "prometheus",
                  "uid": "${datasource}"
                },
                "expr": "sum by (reason) (rate(load_shed_total{namespace=\"$namespace\"}[$__rate_interval]))",
                "legendFormat": "503 shed: {{reason}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "unit": "reqps"
              },
              "overrides": []
            },
            "options": {}
          }
        ]
      }
