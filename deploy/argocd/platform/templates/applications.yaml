{{- $v := .Values }}
{{- $dest := "https://kubernetes.default.svc" }}

# ------------------------------------------------------------------ wave 0
# (The Helm charts join this wave in the next PR of the stack.)
---
# metrics-server: CPU usage for the HorizontalPodAutoscaler. A vendored upstream manifest
# plus one kind-only patch (deploy/platform/metrics-server/).
{{ include "platform.meta" (dict "name" "metrics-server" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/platform/metrics-server
  destination: { server: {{ $dest }}, namespace: kube-system }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- if $v.components.backups }}
---
# The backup bucket (SeaweedFS S3). Its credentials are a Secret scripts/cluster.sh creates
# before this syncs.
{{ include "platform.meta" (dict "name" "backups" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind
    directory: { include: backups.yaml }
  destination: { server: {{ $dest }}, namespace: backups }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
{{- end }}

# The Gateway and the tool routes need only Envoy Gateway's CRDs, which arrive within
# seconds of wave 0 starting: until then their first sync fails and the retry (10 s, then
# 20 s...) catches up. In wave 1 they would wait for the slowest chart instead, and the
# Envoy proxy's start (about 2 minutes) would no longer overlap with it (seen in CI).
---
# The Gateway itself: its two listeners, and the NodePort Service the front door reaches.
{{ include "platform.meta" (dict "name" "gateway" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind
    directory: { include: gateway.yaml }
  destination: { server: {{ $dest }}, namespace: gateway }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
---
# The dev tools' routes on the Gateway's `tools` listener (Argo CD always; the monitoring
# UIs when the stack is installed).
{{ include "platform.meta" (dict "name" "tool-routes" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind/tools
    directory: { include: {{ ternary "'{argocd.yaml,monitoring.yaml}'" "argocd.yaml" $v.components.monitoring }} }
  destination: { server: {{ $dest }}, namespace: argocd }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}

# --------------------------------------------- wave 1: what needs a slow chart running
{{- if $v.components.policies }}
---
# The admission policies. Kyverno's webhook validates them, so they wait for wave 0.
{{ include "platform.meta" (dict "name" "kyverno-policies" "wave" 1) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/policies
  destination: { server: {{ $dest }}, namespace: kyverno }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- end }}
