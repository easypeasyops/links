{{- $v := .Values }}
{{- $dest := "https://kubernetes.default.svc" }}

# ------------------------------------------------------------------ wave 0: charts, CRDs
---
# metrics-server: CPU usage for the HorizontalPodAutoscaler. A vendored upstream manifest
# plus one kind-only patch (deploy/platform/metrics-server/).
{{ include "platform.meta" (dict "name" "metrics-server" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/platform/metrics-server
  destination: { server: {{ $dest }}, namespace: kube-system }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
---
# Envoy Gateway: the controller behind the cluster's front door (Gateway API).
{{ include "platform.meta" (dict "name" "envoy-gateway" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.envoyGateway "release" "eg" "values" "deploy/kind/envoy-gateway-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: envoy-gateway-system }
  # baseline: the Envoy proxy pods the controller creates don't all meet "restricted".
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "baseline")) | nindent 2 }}
---
# Argo Rollouts: prod's canary releases, with the Gateway API traffic-router plugin for
# this node's architecture.
{{- $plugin := dict "name" "argoproj-labs/gatewayAPI" "location" (printf "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/%s/gatewayapi-plugin-linux-%s" $v.gatewayAPIPlugin.version $v.arch) "sha256" (required (printf "no Gateway API plugin checksum for arch %q" $v.arch) (get $v.gatewayAPIPlugin.sha256 $v.arch)) }}
{{ include "platform.meta" (dict "name" "argo-rollouts" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.argoRollouts "release" "argo-rollouts" "values" "deploy/kind/argo-rollouts-values.yaml" "valuesObject" (dict "controller" (dict "trafficRouterPlugins" (list $plugin)))) | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: argo-rollouts }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
{{- if $v.components.monitoring }}
---
# kube-prometheus-stack. Its Grafana admin password is a Secret scripts/cluster.sh creates
# before this syncs (never in git).
{{ include "platform.meta" (dict "name" "monitoring" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.kubePrometheusStack "release" "monitoring" "values" "deploy/kind/monitoring-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: monitoring }
  # "baseline", not "restricted": some of the stack's pods don't meet "restricted" yet.
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "baseline")) | nindent 2 }}
  ignoreDifferences:
    # The chart's admission-webhook Job writes the CA bundle into these after install.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
{{- end }}
{{- if $v.components.policies }}
---
# Kyverno: admission control for staging and prod (deploy/policies/, wave 1).
{{ include "platform.meta" (dict "name" "kyverno" "wave" 0) }}
spec:
  project: platform
  {{- include "platform.chartSources" (dict "root" $ "chart" $v.charts.kyverno "release" "kyverno" "values" "deploy/kind/kyverno-values.yaml") | nindent 2 }}
  destination: { server: {{ $dest }}, namespace: kyverno }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
{{- end }}
{{- if $v.components.backups }}
---
# The backup bucket (SeaweedFS S3). Its credentials are a Secret scripts/cluster.sh creates
# before this syncs.
{{ include "platform.meta" (dict "name" "backups" "wave" 0) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind
    directory: { include: backups.yaml }
  destination: { server: {{ $dest }}, namespace: backups }
  {{- include "platform.syncPolicy" (dict "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
{{- end }}

# --------------------------------------------------- wave 1: what uses those CRDs
---
# The Gateway itself: its two listeners, and the NodePort Service the front door reaches.
{{ include "platform.meta" (dict "name" "gateway" "wave" 1) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind
    directory: { include: gateway.yaml }
  destination: { server: {{ $dest }}, namespace: gateway }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
---
# The dev tools' routes on the Gateway's `tools` listener (Argo CD always; the monitoring
# UIs when the stack is installed).
{{ include "platform.meta" (dict "name" "tool-routes" "wave" 1) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/kind/tools
    directory: { include: {{ ternary "'{argocd.yaml,monitoring.yaml}'" "argocd.yaml" $v.components.monitoring }} }
  destination: { server: {{ $dest }}, namespace: argocd }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- if $v.components.policies }}
---
# The admission policies. Kyverno's webhook validates them, so they wait for wave 0.
{{ include "platform.meta" (dict "name" "kyverno-policies" "wave" 1) }}
spec:
  project: platform
  source:
    repoURL: {{ $v.repoURL }}
    targetRevision: {{ $v.revision }}
    path: deploy/policies
  destination: { server: {{ $dest }}, namespace: kyverno }
  {{- include "platform.syncPolicy" (dict) | nindent 2 }}
{{- end }}
