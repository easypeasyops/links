{{- if .Values.components.monitoring }}
# Argo CD's own monitoring: its application controller scraped, and alerts on it
# (files/argocd-rules.yaml). Part of the root, in wave 1: the CRDs come with
# kube-prometheus-stack in wave 0. Prometheus selects ServiceMonitors and rules in every
# namespace (deploy/kind/monitoring-values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-application-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Its CRD comes with kube-prometheus-stack in wave 0. Argo CD dry-runs every resource
    # before the first wave, and the dry run of a kind that doesn't exist yet fails the
    # whole sync (seen in CI): skip it for this one.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      # The metrics Service the Argo CD chart creates (controller.metrics.enabled,
      # deploy/kind/argocd-values.yaml).
      app.kubernetes.io/name: argocd-metrics
      app.kubernetes.io/component: application-controller
  endpoints:
    - port: http-metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Its CRD comes with kube-prometheus-stack in wave 0. Argo CD dry-runs every resource
    # before the first wave, and the dry run of a kind that doesn't exist yet fails the
    # whole sync (seen in CI): skip it for this one.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- .Files.Get "files/argocd-rules.yaml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
