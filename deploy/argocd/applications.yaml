# GitOps for shortly (docs/DESIGN.md, GitOps with Argo CD): what runs in each environment
# is what deploy/envs/<env>.yaml on main says, including the image digest. A merged PR is a
# deploy; a reverted PR is a rollback. Argo CD checks main every 60 s
# (deploy/kind/argocd-values.yaml).
#
# Applied by scripts/cluster.sh (unless ARGOCD_APPS=0). The two Applications are identical
# except for the environment; tests/test_gitops.py keeps it that way.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortly-staging
  namespace: argocd
  annotations:
    # Compare with the API server's own dry run, not a client-side diff: the API server
    # fills defaults into the HTTPRoute's lists (group, kind, path match), which a client-
    # side diff of a CRD reports as drift, so self-heal would re-apply the route forever.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: shortly
  source:
    repoURL: https://github.com/statsguy/shortly.git
    targetRevision: main
    path: deploy/helm/shortly
    helm:
      releaseName: shortly # resource names stay "shortly", as with deploy.sh
      valueFiles: [../../envs/staging.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: shortly-staging # <app>-<env> (platform plan, Phase 2)
  syncPolicy:
    automated:
      prune: true # a resource removed from the chart is removed from the cluster
      selfHeal: true # a hand edit (kubectl edit, a stray helm upgrade) is reverted
    syncOptions:
      # A sync must not reset what ignoreDifferences ignores (the canary's weights).
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 1m }
  # Fields Argo Rollouts owns in prod. Without these, Argo CD would see prod as OutOfSync,
  # and self-heal would undo the canary: the HTTPRoute's weights (it moves them during a
  # canary), and on the stable/canary Services the pod-template-hash it adds to each
  # selector and the annotation that marks the Service as its own.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.selector["rollouts-pod-template-hash"]
        - .metadata.annotations["argo-rollouts.argoproj.io/managed-by-rollouts"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortly-prod
  namespace: argocd
  annotations:
    # Compare with the API server's own dry run, not a client-side diff: the API server
    # fills defaults into the HTTPRoute's lists (group, kind, path match), which a client-
    # side diff of a CRD reports as drift, so self-heal would re-apply the route forever.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: shortly
  source:
    repoURL: https://github.com/statsguy/shortly.git
    targetRevision: main
    path: deploy/helm/shortly
    helm:
      releaseName: shortly # resource names stay "shortly", as with deploy.sh
      valueFiles: [../../envs/prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: shortly-prod # <app>-<env> (platform plan, Phase 2)
  syncPolicy:
    automated:
      prune: true # a resource removed from the chart is removed from the cluster
      selfHeal: true # a hand edit (kubectl edit, a stray helm upgrade) is reverted
    syncOptions:
      # A sync must not reset what ignoreDifferences ignores (the canary's weights).
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 1m }
  # Fields Argo Rollouts owns in prod. Without these, Argo CD would see prod as OutOfSync,
  # and self-heal would undo the canary: the HTTPRoute's weights (it moves them during a
  # canary), and on the stable/canary Services the pod-template-hash it adds to each
  # selector and the annotation that marks the Service as its own.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.selector["rollouts-pod-template-hash"]
        - .metadata.annotations["argo-rollouts.argoproj.io/managed-by-rollouts"]
