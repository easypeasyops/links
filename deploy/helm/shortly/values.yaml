# Defaults are production-shaped; values-<env>.yaml files override per environment.

image:
  repository: ghcr.io/statsguy/shortly
  # Deploy by digest (sha256:...) whenever possible: a digest is immutable, so the bits
  # tested in staging are exactly the bits promoted to production. `tag` is a fallback.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Used only when autoscaling is disabled.
replicaCount: 2

# Sizing comes from the load test (docs/DESIGN.md, Capacity; re-run scripts/loadtest.sh
# when the request path changes). One pod: ~2 ms CPU per request, meets the latency SLO up
# to ~250 req/s, saturates near 1 core. Target 70% of a 500m request = ~170 req/s per pod,
# leaving ~30% headroom for traffic that grows while new pods start.
autoscaling:
  enabled: true
  minReplicas: 2 # survive one pod loss / a drain; the PDB keeps 1 up
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Rendering fails if maxReplicas x config.dbPoolSize exceeds this. Postgres default
  # max_connections is 100; keep room for migrations, admin sessions and the other env.
  maxDbConnections: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # react to a spike at once
      policies:
        - { type: Percent, value: 100, periodSeconds: 15 } # at most double every 15 s
        - { type: Pods, value: 4, periodSeconds: 15 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300 # scale in only after 5 quiet minutes: no flapping
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }

# Non-secret config. Becomes SHORTLY_* environment variables.
config:
  baseUrl: "https://sho.rt"
  logLevel: INFO
  # Measured: median 1, peak 4 connections in use at ~300 req/s per pod; 1 was too few.
  dbPoolSize: 5
  # Wait this long for a free connection, then shed with 503 + Retry-After (not 30 s).
  dbPoolTimeoutSeconds: 1
  # Postgres cancels a statement running longer than this, or waiting on a row lock longer
  # than dbLockTimeoutMs; the request gets a 503 + Retry-After instead of holding a
  # connection. The slowest real query is a few ms, so 2 s only catches a sick database.
  dbStatementTimeoutMs: 2000
  dbLockTimeoutMs: 1000
  # Requests one pod works on at once; more are answered 503 + Retry-After in ~1 ms instead
  # of queueing until every request is slow. Sized from the load test (docs/DESIGN.md,
  # Capacity): well above what a pod needs at capacity, well below a queue of seconds.
  maxConcurrentRequests: 16
  # DRILLS ONLY: this share (0-1) of creates and redirects fails with 500 while probes stay
  # green, i.e. a release that is ready but broken. The canary drill sets it to prove that
  # analysis catches such a release. Never set in deploy/envs/. 0 renders no variable at all.
  faultErrorRatio: 0
  # /metrics is served on this port, not the app port: the Service exposes it to Prometheus
  # only, and the NetworkPolicy below admits nothing else to it.
  metricsPort: 9100
  # Per-client limit on POST /links: a burst, then a sustained rate (0 turns it off).
  # Exact across replicas: the state lives in Postgres (docs/DESIGN.md, Rate limiting).
  rateLimit:
    createsPerMinute: 60
    burst: 20
  # Peers whose X-Forwarded-For uvicorn believes (comma-separated IPs or CIDRs). The
  # limiter keys on the client IP, so this must be exactly your ingress / load balancer:
  # anyone listed here can claim to be any client. Default: nobody but localhost.
  forwardedAllowIps: "127.0.0.1"

# The database URL is a secret and is NEVER put in values files (they live in git).
# Create it out of band (kubectl, External Secrets, Sealed Secrets, Vault...) and point here.
database:
  existingSecret: shortly-db
  secretKey: url

# OpenTelemetry: tracing is on only if an endpoint is set.
otel:
  endpoint: ""

migrations:
  enabled: true
  # The Job runs as a Helm pre-install/pre-upgrade hook: the schema is migrated BEFORE
  # new pods start, and a failed migration aborts the release (old pods keep serving).
  backoffLimit: 1
  activeDeadlineSeconds: 300

service:
  type: ClusterIP
  port: 80

# Route users in through a Gateway API Gateway (deploy/kind/gateway.yaml in kind). Off by
# default: the chart works without one, and a cluster without the Gateway API CRDs.
gateway:
  enabled: false
  name: shortly
  namespace: gateway
  hostnames: []

# Canary releases with Argo Rollouts (docs/DESIGN.md, Canary releases). Needs the Argo
# Rollouts controller with its Gateway API plugin (the platform) and gateway.enabled.
# On: a Rollout replaces the Deployment; a new release first gets each `weights` share of
# the Gateway's traffic in turn, and moves on only if analysis passes; else it is aborted
# and all traffic stays on the old version. A first install, or a rollback to one of the
# last `rollbackWindow` revisions, skips the steps.
canary:
  enabled: false
  weights: [10, 50] # % of traffic to the new version per step; 100 follows the last
  # A pod that isn't ready this long after its step starts aborts the release.
  progressDeadlineSeconds: 180
  rollbackWindow: 3
  # Rendered only where Prometheus scrapes the app (monitoring.enabled and the Prometheus
  # Operator CRDs): no metrics, no analysis. Without it each step is a plain `pause`.
  analysis:
    prometheusUrl: http://kps-prometheus.monitoring.svc:9090
    initialDelay: 60s # let Prometheus discover and scrape the new pods twice first
    interval: 30s
    count: 4 # measurements per step, so a step lasts initialDelay + count x interval
    # Judged on the CANARY's pods only (label rollouts_pod_template_hash), over [1m].
    minRequestRate: 0.5 # req/s: below this there's too little traffic to judge: fail
    maxErrorRatio: 0.01 # 5xx share of all non-probe requests; one bad measurement aborts
    maxRedirectP99Seconds: 0.25 # coarse: small samples make p99 noisy; 2 bad ones abort
    # Requests to judge the canary on: a k6 Job runs beside each analysis step, sending this
    # many req/s through the Gateway with the first gateway hostname (files/canary-traffic.js).
    # Part of the analysis, so a canary started by anyone (Argo CD, deploy.sh) gets it.
    # A prod with real users turns it off; then `minRequestRate` guards a quiet hour.
    syntheticTraffic:
      enabled: true
      rate: 20
      image: grafana/k6:2.3.0
      url: http://shortly-gateway.envoy-gateway-system.svc
  pauseWithoutAnalysis: 60s

resources:
  requests:
    cpu: 500m # measured ~0.5 cores at 250 req/s; also the HPA's 100%
    memory: 128Mi
  limits:
    # No CPU limit on purpose: CPU limits cause throttling even when the node is idle.
    # Memory limit stays: a leak should OOM-kill one pod, not the node.
    memory: 256Mi

# Seconds the pod keeps serving after it's told to stop, so the endpoint removal can
# propagate to every kube-proxy / load balancer before the process stops accepting.
preStopSleepSeconds: 5
# Must exceed preStop + uvicorn's graceful drain (20s in the Dockerfile CMD).
terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Prometheus Operator integration (kube-prometheus-stack; the platform installs it in
# kind). Off by default because the ServiceMonitor and PrometheusRule kinds need its CRDs.
monitoring:
  enabled: false # a ServiceMonitor: Prometheus scrapes /metrics on every pod
  scrapeInterval: 15s
  # The alert rules and the SLO dashboard are cluster-wide: every rule already aggregates
  # `by (namespace)`, so they cover all environments. Exactly ONE release per cluster may
  # ship them (prod); two copies would evaluate every recording rule twice and collide.
  clusterWide: false

nodeSelector: {}
tolerations: []
affinity: {}

# Expired-link cleanup (templates/cleanup-cronjob.yaml). Links expired less than graceDays
# ago are kept, so they still answer 410 Gone. One run deletes at most
# batchSize x maxBatches rows; a bigger backlog is finished by the next runs.
cleanup:
  enabled: true
  schedule: "17 * * * *" # hourly, off the top of the hour when every other job runs
  graceDays: 7
  batchSize: 1000
  maxBatches: 100
  activeDeadlineSeconds: 900

# Who may talk to the pods, and whom they may talk to (templates/networkpolicy.yaml). Needs a
# CNI that enforces NetworkPolicy (kind's kindnet does; the e2e proves it); on one that
# doesn't, these objects are silently ignored.
networkPolicy:
  enabled: true
  # Callers of the app port. [] = anyone: the Service is the public entry point. On a real
  # cluster, narrow this to the ingress controller's namespace.
  httpFrom: []
  # Scrapers of the metrics port: Prometheus from kube-prometheus-stack, and nobody else.
  metricsFrom:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: monitoring }
      podSelector:
        matchLabels: { app.kubernetes.io/name: prometheus }
  # The only place the app (and its migration Job) may connect to, besides DNS. A managed
  # database outside the cluster would be an ipBlock here.
  databaseTo:
    - podSelector:
        matchLabels: { app: postgres }
  databasePort: 5432
  # More egress rules, e.g. to an OpenTelemetry collector when otel.endpoint is set.
  extraEgress: []
