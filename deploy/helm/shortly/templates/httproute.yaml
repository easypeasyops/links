{{- if .Values.gateway.enabled }}
# Users reach the app through the cluster's Gateway (Gateway API), by hostname. In prod,
# Argo Rollouts shifts this route's weights between the stable and canary Services during
# a canary release.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        {{- if .Values.canary.enabled }}
        # Argo Rollouts sets these weights during a release. 100/0 is the resting state, so
        # an upgrade that re-applies them (before the Rollout starts its steps) is harmless.
        - name: {{ include "service.fullname" . }}-stable
          port: {{ .Values.service.port }}
          weight: 100
        - name: {{ include "service.fullname" . }}-canary
          port: {{ .Values.service.port }}
          weight: 0
        {{- else }}
        - name: {{ include "service.fullname" . }}
          port: {{ .Values.service.port }}
        {{- end }}
{{- end }}
