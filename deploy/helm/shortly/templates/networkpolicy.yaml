{{- if .Values.networkPolicy.enabled }}
# Least privilege on the network, for the app pods and the migration Job (both carry the
# selector labels). Once a pod is selected, everything not listed here is denied:
#   in:  the app port from httpFrom (anyone by default), the metrics port from Prometheus
#   out: DNS, and the database. Nothing else: the app calls no other service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { port: 8000, protocol: TCP }
      {{- with .Values.networkPolicy.httpFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - { port: {{ .Values.config.metricsPort }}, protocol: TCP }
      from:
        {{- required "networkPolicy.metricsFrom must name the scraper" .Values.networkPolicy.metricsFrom | toYaml | nindent 8 }}
  egress:
    {{- include "service.egress" . | nindent 4 }}
{{- if .Values.cleanup.enabled }}
---
# The cleanup Job's pods: nothing may connect to them; they may reach DNS and the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}-cleanup
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service.cleanupSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "service.egress" . | nindent 4 }}
{{- end }}
{{- end }}
