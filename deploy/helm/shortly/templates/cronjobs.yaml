{{- /* One CronJob per entry in cronJobs (values.yaml): the release image, the app's env
     plus the job's own. Kyverno verifies its provenance like the app's (CronJob templates
     are checked too). Run one now:
       kubectl -n <ns> create job <name>-manual --from=cronjob/<release>-<name> */}}
{{- range $name, $job := .Values.cronJobs }}
{{- if $job }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "service.fullname" $ }}-{{ $name }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: Etc/UTC
  # Never two runs at once from the schedule (a manual run may overlap: the job must make
  # that safe). A run that starts late (a laptop that slept, a controller restart) still
  # starts within 50 minutes; later than that it is skipped, not queued.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3000
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "service.jobSelectorLabels" (dict "root" $ "name" $name) | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- include "service.podSecurityContext" $ | nindent 12 }}
          containers:
            - name: {{ $name }}
              image: {{ include "service.image" $ }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command:
                {{- toYaml $job.command | nindent 16 }}
              env:
                {{- include "service.env" $ | trim | nindent 16 }}
                {{- include "service.envList" (dict "root" $ "env" $job.env) | trim | nindent 16 }}
              securityContext:
                {{- include "service.containerSecurityContext" $ | nindent 16 }}
              resources:
                {{- toYaml $job.resources | nindent 16 }}
{{- end }}
{{- end }}
