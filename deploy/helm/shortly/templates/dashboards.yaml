{{- if and .Values.monitoring.enabled .Values.monitoring.clusterWide }}
# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1, in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shortly.fullname" . }}-dashboards
  labels:
    {{- include "shortly.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{- (.Files.Glob "dashboards/*.json").AsConfig | nindent 2 }}
{{- end }}
