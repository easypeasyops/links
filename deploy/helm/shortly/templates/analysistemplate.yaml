{{- if include "shortly.canaryAnalysis" . }}
{{- $a := .Values.canary.analysis }}
{{- /* Argo's own placeholders, kept away from Helm's template engine. */}}
{{- $hash := "{{args.canary-hash}}" }}
{{- $sel := printf "namespace=%q, rollouts_pod_template_hash=%q" .Release.Namespace $hash }}
# What a canary step checks, on the canary's pods only. Prometheus scrapes each pod with its
# rollouts-pod-template-hash label (the ServiceMonitor's podTargetLabels), so the canary's
# series are told apart from the stable pods' without any new metric in the app.
# Absolute thresholds, not "no worse than stable": simple to reason about, and the stable
# version meets them by a wide margin (docs/DESIGN.md, Capacity).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "shortly.fullname" . }}-canary
  labels:
    {{- include "shortly.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash
  metrics:
    # Too little traffic proves nothing: fail rather than pass a canary nobody used.
    # (`or vector(0)`: no series at all is 0 req/s, a clear failure, not a query error.)
    # One miss is allowed: the first measurement can land before Prometheus has scraped the
    # new pod twice (service discovery lags), which reads as 0 req/s.
    - name: traffic
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: 1
      successCondition: result[0] >= {{ $a.minRequestRate }}
      provider:
        prometheus:
          address: {{ $a.prometheusUrl }}
          query: |
            sum(rate(http_requests_total{ {{- $sel }}, route!~"/healthz|/readyz"}[1m])) or vector(0)
    # Server errors, including 503 from load shedding: what the availability SLOs count.
    - name: error-ratio
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: 0
      successCondition: result[0] <= {{ $a.maxErrorRatio }}
      provider:
        prometheus:
          address: {{ $a.prometheusUrl }}
          query: |
            (sum(rate(http_requests_total{ {{- $sel }}, route!~"/healthz|/readyz", status=~"5.."}[1m])) or vector(0))
            /
            sum(rate(http_requests_total{ {{- $sel }}, route!~"/healthz|/readyz"}[1m]))
{{- with $a.syntheticTraffic }}{{ if .enabled }}
    # Not a check: the traffic the checks above judge. Lasts as long as the step's analysis.
    {{- $delay := trimSuffix "s" (toString $a.initialDelay) }}
    {{- $interval := trimSuffix "s" (toString $a.interval) }}
    {{- if not (and (regexMatch "^[0-9]+s$" (toString $a.initialDelay)) (regexMatch "^[0-9]+s$" (toString $a.interval))) }}
    {{- fail "canary.analysis.initialDelay and .interval must be in seconds (\"60s\") when syntheticTraffic is enabled" }}
    {{- end }}
    {{- $seconds := add (atoi $delay) (mul (atoi $interval) (int $a.count)) 15 }}
    - name: synthetic-traffic
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: {{ add $seconds 120 }}
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: canary-traffic
                  app.kubernetes.io/instance: {{ $.Release.Name }}
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 12345
                  runAsGroup: 12345
                  seccompProfile: { type: RuntimeDefault }
                containers:
                  - name: k6
                    image: {{ .image }}
                    args: [run, --quiet, --no-color, --no-thresholds, /scripts/canary-traffic.js]
                    env:
                      - { name: BASE_URL, value: {{ .url | quote }} }
                      - { name: HOST, value: {{ first $.Values.gateway.hostnames | quote }} }
                      - { name: RATE, value: {{ .rate | quote }} }
                      - { name: DURATION, value: "{{ $seconds }}s" }
                    resources:
                      requests: { cpu: 50m, memory: 64Mi }
                      limits: { memory: 256Mi }
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: { drop: [ALL] }
                    volumeMounts:
                      - { name: scripts, mountPath: /scripts, readOnly: true }
                      - { name: tmp, mountPath: /tmp }
                volumes:
                  - name: scripts
                    configMap: { name: {{ include "shortly.fullname" $ }}-canary-traffic }
                  - name: tmp
                    emptyDir: { sizeLimit: 64Mi }
{{- end }}{{ end }}
    - name: redirect-p99
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: 1
      successCondition: result[0] <= {{ $a.maxRedirectP99Seconds }}
      provider:
        prometheus:
          address: {{ $a.prometheusUrl }}
          query: |
            histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{ {{- $sel }}, method="GET", route="/{code}"}[1m])))
{{- if $a.syntheticTraffic.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shortly.fullname" . }}-canary-traffic
  labels:
    {{- include "shortly.labels" . | nindent 4 }}
data:
  canary-traffic.js: |
    {{- .Files.Get "files/canary-traffic.js" | nindent 4 }}
{{- end }}
{{- end }}
