{{- if .Values.autoscaling.enabled }}
{{- if not .Values.resources.requests.cpu }}
{{- fail "autoscaling.enabled needs resources.requests.cpu: utilization is a percentage of it" }}
{{- end }}
{{- $max := int .Values.autoscaling.maxReplicas }}
{{- $budget := mul $max (int .Values.config.dbPoolSize) }}
{{- if gt $budget (int .Values.autoscaling.maxDbConnections) }}
{{- fail (printf "maxReplicas x dbPoolSize = %d connections exceeds autoscaling.maxDbConnections (%d)" $budget (int .Values.autoscaling.maxDbConnections)) }}
{{- end }}
# Scales on CPU because CPU is the measured bottleneck (docs/DESIGN.md, Capacity): one pod
# saturates at ~1 core (single worker, GIL) long before its DB pool does.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "shortly.fullname" . }}
  labels:
    {{- include "shortly.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "shortly.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- with .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
