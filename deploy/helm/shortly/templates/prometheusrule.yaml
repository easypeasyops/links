{{- if and .Values.monitoring.enabled .Values.monitoring.clusterWide (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
{{- /* One PrometheusRule per file in rules/: the same files compose's Prometheus loads and
       promtool tests, so what is tested is what ships. */}}
{{- range $path, $_ := .Files.Glob "rules/*.yaml" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "shortly.fullname" $ }}-{{ base $path | trimSuffix ".yaml" }}
  labels:
    {{- include "shortly.labels" $ | nindent 4 }}
spec:
  {{- $.Files.Get $path | nindent 2 }}
{{- end }}
{{- end }}
