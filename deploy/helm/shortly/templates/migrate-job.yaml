{{- if .Values.migrations.enabled }}
# Runs `alembic upgrade head` from the SAME image as the release, before the new pods
# start. One Job per release — not an initContainer in every replica, which would have N
# pods racing to migrate the same schema.
#
# Rule this enables: migrations must be backward-compatible with the PREVIOUS app
# version (expand → deploy → contract), because old pods keep serving while new ones roll
# out, and a rollback runs old code against the new schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shortly.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "shortly.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # Keep a failed Job around for `kubectl logs`; delete successful ones.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "shortly.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: shortly
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "shortly.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "shortly.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "shortly.env" . | nindent 12 }}
          securityContext:
            {{- include "shortly.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
{{- end }}
