{{- if not .Values.canary.enabled }}
# Staging and other non-canary environments. With canary.enabled the Rollout
# (rollout.yaml) owns these pods instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shortly.fullname" . }}
  labels:
    {{- include "shortly.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # With autoscaling on, `replicas` is left out ON PURPOSE: the HPA owns it, and a value
  # here would reset the live count on every `helm upgrade` (mid-spike, too).
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below desired capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "shortly.selectorLabels" . | nindent 6 }}
  template:
    {{- include "shortly.podTemplate" . | nindent 4 }}
{{- end }}
