apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shortly.fullname" . }}
  labels:
    {{- include "shortly.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # With autoscaling on, `replicas` is left out ON PURPOSE: the HPA owns it, and a value
  # here would reset the live count on every `helm upgrade` (mid-spike, too).
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below desired capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "shortly.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shortly.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ include "shortly.version" . | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false # the app never talks to the Kubernetes API
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "shortly.podSecurityContext" . | nindent 8 }}
      # Spread replicas across nodes so one node failure isn't an outage.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "shortly.selectorLabels" . | nindent 14 }}
      containers:
        - name: app
          image: {{ include "shortly.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "shortly.env" . | nindent 12 }}
          securityContext:
            {{- include "shortly.containerSecurityContext" . | nindent 12 }}
          # startupProbe gates the other two, so a slow start isn't killed by liveness.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe: # "restart me if wedged" — never checks the DB (see api.py)
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe: # "send me traffic?" — DB down ⇒ out of rotation, not restarted
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              # Kubernetes sends SIGTERM and removes the pod from endpoints *concurrently*.
              # Sleeping first lets routers stop sending traffic before uvicorn drains.
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp # read-only root FS; give Python a writable /tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
