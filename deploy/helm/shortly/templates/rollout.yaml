{{- if .Values.canary.enabled }}
{{- if not .Values.gateway.enabled }}
{{- fail "canary.enabled needs gateway.enabled: the canary's share of traffic is set on the HTTPRoute" }}
{{- end }}
{{- $analysis := include "service.canaryAnalysis" . }}
# Argo Rollouts canary (docs/DESIGN.md, Canary releases). Same pods as the Deployment it
# replaces (templates/_podtemplate.tpl); what differs is how a new version takes over:
#   setWeight 10 → analysis → setWeight 50 → analysis → 100%
# The Gateway API plugin moves the HTTPRoute's weights between the stable and canary
# Services. Any failed analysis, or a canary pod not ready within progressDeadlineSeconds,
# aborts: traffic returns to the stable pods, which were never scaled down.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # (With autoscaling, the HPA owns `replicas`, exactly as for the Deployment.)
  revisionHistoryLimit: 5
  progressDeadlineSeconds: {{ .Values.canary.progressDeadlineSeconds }}
  progressDeadlineAbort: true # a canary that never gets ready is aborted, not left half-done
  # Going back to one of the last N revisions (helm rollback) skips the steps: those pods
  # already served all traffic, and a rollback is the moment not to wait on analysis.
  rollbackWindow:
    revisions: {{ .Values.canary.rollbackWindow }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    {{- include "service.podTemplate" . | nindent 4 }}
  strategy:
    canary:
      stableService: {{ include "service.fullname" . }}-stable
      canaryService: {{ include "service.fullname" . }}-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: {{ include "service.fullname" . }}
            namespace: {{ .Release.Namespace }}
      steps:
        {{- range .Values.canary.weights }}
        - setWeight: {{ . }}
        {{- if $analysis }}
        - analysis:
            templates:
              - templateName: {{ include "service.fullname" $ }}-canary
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- else }}
        - pause: { duration: {{ $.Values.canary.pauseWithoutAnalysis }} }
        {{- end }}
        {{- end }}
---
# Stable and canary Services: the HTTPRoute's two backends. Argo Rollouts adds
# rollouts-pod-template-hash to each selector, so each one holds a single version's pods.
# Traffic only: no metrics port, so the ServiceMonitor (which scrapes port "metrics" of
# Services with the selector labels) finds no targets here and scrapes every pod once,
# through the main Service. Its endpoints carry both versions.
{{- range $role := list "stable" "canary" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" $ }}-{{ $role }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  type: ClusterIP
  selector:
    {{- include "service.selectorLabels" $ | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
{{- end }}
{{- end }}
