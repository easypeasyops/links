{{- if and .Values.podDisruptionBudget.enabled (gt (int (include "service.minReplicas" .)) 1) }}
# Voluntary disruptions (node drains, cluster upgrades) may evict pods only while at least
# minAvailable stay up. Skipped for a single replica, where it would block every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
{{- end }}
