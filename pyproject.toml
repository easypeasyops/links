[project]
name = "shortly"
version = "0.1.0"
description = "URL shortener — a hands-on DevOps practice project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shortly = "shortly:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.169.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # import sorting
  "UP",            # modernize syntax for target version
  "B",             # bugbear: real bug patterns (mutable defaults, etc.)
  "SIM", "C4",     # simplifications, comprehensions
  "RUF",           # ruff-specific
  "S",             # bandit security checks
  "PT",            # pytest style
  "TID252",        # ban relative imports
  "DTZ",           # naive datetimes (a classic prod bug)
  "ASYNC",         # blocking calls inside async code
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # allow assert in tests

[tool.mypy]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker.*"]          # pulled in by testcontainers; ships no type stubs
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]   # a new deprecation fails the build now, not the upgrade later
markers = ["integration: needs Docker (Postgres via testcontainers); deselect with -m 'not integration'"]
addopts = [
  "--strict-markers", "--strict-config", "-ra",
  "--cov=shortly", "--cov-branch", "--cov-report=term-missing",
]

[tool.coverage.report]
# The 90% floor is enforced in CI (`pytest --cov-fail-under=90`), where the full suite runs.
# Enforcing it here would fail every partial local run (-m "not integration", -k, one file).
skip_covered = true
exclude_also = ["\\.\\.\\.$"]   # Protocol method stubs
